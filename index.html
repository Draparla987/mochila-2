<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#BDE8FF">
<meta name="description" content="Juegos para repasar en casa lo de 2º de Primaria con Mochi: ortografía, comprensión, números, cuentas, tablas, animales, inglés y lectura.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Mochila de 2º</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mochila 2º">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;700;800&display=swap">
<style>
/* Layout: mundo de plastilina — cielo de fondo, Mochi (la mascota) guía cada pantalla, fichas gorditas con relieve como juguetes */
:root{
  --sky1:#BDE8FF; --sky2:#F1FAFF; --cloud:rgba(255,255,255,.75);
  --ink:#232A4D; --ink-soft:#5C6589; --card:#FFFFFF; --line:#DDE6F4; --paper:#F7FAFF; --rule:#D8E6F6;
  --lengua:#F04F59; --mates:#3570F0; --cono:#1FA862; --ingles:#8456F0; --lectura:#F07A12; --arte:#DE3F96;
  --sun:#FFC93C; --on-c:#FFFFFF;
  --ok:#1FA65A; --ok-bg:#E3F7EA; --ko:#EC4256; --ko-bg:#FFE9EC; --star:#FFB400; --star-off:#D7E0EE;
  --shadow:rgba(35,42,77,.16);
  --f-display:"Baloo 2","Arial Rounded MT Bold",ui-rounded,system-ui,sans-serif;
  --f-read:"Andika","Trebuchet MS",system-ui,sans-serif;
  --r:28px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --sky1:#101A36; --sky2:#1B2852; --cloud:rgba(255,255,255,.05);
  --ink:#F2F5FF; --ink-soft:#AAB4D8; --card:#1F2B52; --line:#33416E; --paper:#18234A; --rule:#2B3966;
  --ok:#3ED184; --ok-bg:#163C2E; --ko:#FF7385; --ko-bg:#4A2235; --star:#FFC933; --star-off:#3A4775;
  --shadow:rgba(0,0,0,.4); color-scheme:dark }}
:root[data-theme="dark"]{
  --sky1:#101A36; --sky2:#1B2852; --cloud:rgba(255,255,255,.05);
  --ink:#F2F5FF; --ink-soft:#AAB4D8; --card:#1F2B52; --line:#33416E; --paper:#18234A; --rule:#2B3966;
  --ok:#3ED184; --ok-bg:#163C2E; --ko:#FF7385; --ko-bg:#4A2235; --star:#FFC933; --star-off:#3A4775;
  --shadow:rgba(0,0,0,.4); color-scheme:dark }

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0; color:var(--ink); font-family:var(--f-read); font-size:18px; line-height:1.45;
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 70%) fixed; background-color:var(--sky2);
  -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; overflow-x:hidden}
body::before{content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(60px 34px at 12% 14%,var(--cloud) 98%,transparent),radial-gradient(44px 30px at 16% 11%,var(--cloud) 98%,transparent),
    radial-gradient(80px 40px at 84% 22%,var(--cloud) 98%,transparent),radial-gradient(52px 34px at 89% 18%,var(--cloud) 98%,transparent),
    radial-gradient(70px 36px at 60% 8%,var(--cloud) 98%,transparent),
    radial-gradient(900px 260px at 50% 112%,color-mix(in srgb,var(--cono) 22%,transparent) 60%,transparent 61%)}
input{-webkit-user-select:text; user-select:text}
button{font:inherit; color:inherit; cursor:pointer; touch-action:manipulation}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:4px solid var(--mates); outline-offset:3px}
img{display:block; max-width:100%}
#app{max-width:1040px; margin:0 auto; padding-inline:16px; padding-block:10px 160px}
h1,h2,h3{font-family:var(--f-display); line-height:1.08; margin:0; text-wrap:balance; font-weight:800}

/* barra superior */
.topbar{display:flex; align-items:center; gap:10px; padding-block:4px 10px}
.brand{display:flex; align-items:center; gap:8px; margin-right:auto; background:none; border:0; padding:0; font-family:var(--f-display); font-weight:800; font-size:1.5rem}
.brand img{width:48px; height:48px; object-fit:contain; filter:drop-shadow(0 3px 2px var(--shadow))}
.pill{display:flex; align-items:center; gap:8px; min-height:52px; background:var(--card); border:0; border-radius:999px; padding:4px 16px 4px 4px; font-weight:700; box-shadow:0 4px 0 var(--line),0 8px 18px var(--shadow)}
.pill .av{font-size:1.5rem; width:44px; height:44px; display:grid; place-items:center; border-radius:50%; background:color-mix(in srgb,var(--sun) 40%,var(--card))}
.coin{display:inline-flex; align-items:center; gap:4px; font-family:var(--f-display); font-weight:800; font-size:1.15rem; font-variant-numeric:tabular-nums}
.coin::before{content:"★"; display:grid; place-items:center; width:28px; height:28px; border-radius:50%; background:var(--star); color:#fff; font-size:1rem; box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.round{width:52px; height:52px; flex:none; border-radius:50%; border:0; background:var(--card); font-size:1.4rem; display:grid; place-items:center; box-shadow:0 4px 0 var(--line),0 8px 18px var(--shadow)}
.round:active,.pill:active{transform:translateY(3px); box-shadow:0 1px 0 var(--line)}

/* botones de juguete */
.btn{--c:var(--mates); display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:64px; padding:10px 30px; border:0; border-radius:22px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 78%,#fff),var(--c)); color:var(--on-c); font-family:var(--f-display); font-weight:800; font-size:1.4rem;
  text-shadow:0 2px 0 rgba(0,0,0,.15); box-shadow:inset 0 -6px 0 color-mix(in srgb,var(--c) 70%,#000),inset 0 3px 0 rgba(255,255,255,.35),0 8px 18px color-mix(in srgb,var(--c) 35%,transparent); transition:transform .08s}
.btn:active{transform:translateY(3px) scale(.98)}
.btn.ghost{background:var(--card); color:var(--ink); text-shadow:none; box-shadow:inset 0 -5px 0 var(--line),0 6px 14px var(--shadow)}
.btn.big{min-height:76px; font-size:1.65rem; padding-inline:40px}
.btn[disabled]{opacity:.45; pointer-events:none}
.row{display:flex; flex-wrap:wrap; gap:14px; align-items:center}
.center{justify-content:center; text-align:center}

/* Mochi y bocadillos */
.mochi{object-fit:contain; filter:drop-shadow(0 10px 10px var(--shadow)); animation:float 3.2s ease-in-out infinite}
.bubble{position:relative; background:var(--card); border-radius:26px; padding:16px 22px; box-shadow:0 6px 0 var(--line),0 12px 26px var(--shadow); min-width:0}
.bubble::before{content:""; position:absolute; left:-14px; top:38px; border:14px solid transparent; border-right-color:var(--card); border-left:0}
.bubble h1{font-size:clamp(1.9rem,4.6vw,2.7rem)}
.bubble p{margin:4px 0 0; color:var(--ink-soft); font-size:1.15rem}
.say{width:52px; height:52px; flex:none; border-radius:50%; border:0; background:color-mix(in srgb,var(--c,var(--mates)) 14%,var(--card)); color:var(--c,var(--mates)); font-size:1.4rem; display:grid; place-items:center; box-shadow:inset 0 -4px 0 color-mix(in srgb,var(--c,var(--mates)) 25%,var(--line))}
.say:active{transform:scale(.94)}
.say.on{animation:pulse 1s infinite}

/* inicio */
.hero{display:grid; grid-template-columns:auto 1fr; align-items:center; gap:10px 18px; margin-block:4px 22px}
.hero .mochi{width:clamp(130px,22vw,190px)}
.hero .bubble{display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px}
.hero .bubble > div{flex:1; min-width:200px}
.subjects{display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:26px 20px; padding-top:14px}
.subj{--c:var(--mates); position:relative; text-align:left; border:0; border-radius:var(--r); padding:22px 22px 20px; min-height:190px; color:var(--on-c);
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 72%,#fff) 0%,var(--c) 62%);
  box-shadow:inset 0 -9px 0 color-mix(in srgb,var(--c) 68%,#000),inset 0 4px 0 rgba(255,255,255,.35),0 14px 26px color-mix(in srgb,var(--c) 35%,transparent);
  display:flex; flex-direction:column; gap:6px; transition:transform .12s}
.subj:active{transform:scale(.97) translateY(3px)}
.subj-img{position:absolute; right:-8px; top:-30px; width:150px; height:150px; object-fit:contain; filter:drop-shadow(0 8px 6px rgba(0,0,0,.18)); transition:transform .25s}
.subj:hover .subj-img{transform:rotate(-6deg) scale(1.05)}
.subj-name{font-family:var(--f-display); font-weight:800; font-size:2.1rem; line-height:1; text-shadow:0 3px 0 rgba(0,0,0,.14); padding-right:120px}
.subj-blurb{font-size:1rem; line-height:1.3; padding-right:110px; opacity:.96; flex:1}
.subj-prog{display:flex; align-items:center; gap:10px; font-family:var(--f-display); font-weight:800; font-size:1.05rem}
.bar{flex:1; height:14px; border-radius:8px; background:rgba(0,0,0,.18); overflow:hidden; box-shadow:inset 0 2px 0 rgba(0,0,0,.12)}
.bar i{display:block; height:100%; min-width:14px; background:linear-gradient(180deg,#FFE27A,var(--star)); border-radius:8px; transition:width 1.2s cubic-bezier(.3,1.1,.5,1) .15s}
.subj-prog b{font-weight:800; font-variant-numeric:tabular-nums}
.subj-prog .st{color:#FFE27A; text-shadow:0 2px 0 rgba(0,0,0,.2); font-size:1.25rem; margin-left:-6px}
.subj-prog.grow b,.subj-prog.grow .st{display:inline-block; animation:bounce .6s .9s}
.subj-prog.full .bar i{background:linear-gradient(90deg,#FFE27A,#FFF6C9,#FFB400,#FFE27A); background-size:300% 100%; animation:gold 3s linear infinite}
@keyframes gold{to{background-position:-300% 0}}
.subj-cup{position:absolute; left:-12px; top:-22px; font-size:2.6rem; line-height:1; filter:drop-shadow(0 4px 4px rgba(0,0,0,.25)); animation:float 3s ease-in-out infinite}
.coin.pop{animation:bounce .6s} .coin.pop::before{animation:starpop2 .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes starpop2{50%{transform:scale(1.5) rotate(25deg)}}
.shelf{margin-top:34px}
.shelf-head{display:flex; align-items:center; gap:12px; margin-bottom:12px}
.shelf-head h2{font-size:1.7rem}
.shelf-row{display:grid; grid-template-columns:repeat(6,minmax(0,1fr)); gap:12px; padding:16px 16px 22px; border-radius:var(--r);
  background:linear-gradient(180deg,color-mix(in srgb,#D9A066 32%,var(--card)),color-mix(in srgb,#C68A50 48%,var(--card)));
  box-shadow:inset 0 -12px 0 color-mix(in srgb,#8F5D2E 60%,var(--card)),0 10px 22px var(--shadow)}
.trophy{position:relative; display:flex; flex-direction:column; align-items:center; gap:4px; min-width:0; border:0; border-radius:20px; padding:12px 6px 10px; background:var(--card); box-shadow:inset 0 -5px 0 var(--line),0 4px 10px var(--shadow)}
.trophy:active{transform:translateY(3px) scale(.98)}
.trophy .cup{font-size:2.6rem; line-height:1; filter:grayscale(1) opacity(.3)}
.trophy img{position:absolute; right:2px; top:2px; width:44px; height:44px; object-fit:contain; filter:grayscale(1) opacity(.45)}
.trophy .t-name{font-family:var(--f-display); font-weight:800; font-size:.98rem; line-height:1.05; text-align:center; overflow-wrap:anywhere}
.trophy .t-sub{font-size:.85rem; font-weight:700; color:var(--ink-soft); font-variant-numeric:tabular-nums}
.trophy.own{background:linear-gradient(180deg,color-mix(in srgb,var(--star) 22%,var(--card)),var(--card)); box-shadow:inset 0 -5px 0 color-mix(in srgb,var(--star) 55%,var(--line)),0 0 0 3px var(--star),0 6px 14px var(--shadow)}
.trophy.own .cup{filter:drop-shadow(0 4px 3px rgba(0,0,0,.2)); animation:float 3s ease-in-out infinite}
.trophy.own img{filter:none}
.trophy.own .t-sub{color:var(--c)}
@media (max-width:860px){ .shelf-row{grid-template-columns:repeat(3,minmax(0,1fr))} }
.families{margin-top:30px; background:var(--card); border-radius:var(--r); padding:4px 22px; box-shadow:0 5px 0 var(--line),0 10px 22px var(--shadow)}
.families summary{font-family:var(--f-display); font-weight:800; font-size:1.25rem; padding-block:14px; cursor:pointer}
.families ul{margin:0 0 14px; padding-left:20px; max-width:72ch}
.families li{margin-bottom:6px}
.families p{max-width:72ch; color:var(--ink-soft)}

/* asignatura */
.banner{--c:var(--mates); position:relative; display:flex; align-items:center; gap:16px; min-height:150px; padding:20px 170px 20px 20px; margin:6px 0 24px; border-radius:var(--r); color:var(--on-c);
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 72%,#fff),var(--c) 65%); box-shadow:inset 0 -9px 0 color-mix(in srgb,var(--c) 68%,#000),0 14px 26px color-mix(in srgb,var(--c) 30%,transparent)}
.banner h1{font-size:clamp(2.2rem,6vw,3.2rem); text-shadow:0 3px 0 rgba(0,0,0,.15)}
.banner p{margin:2px 0 0; font-size:1.1rem; opacity:.95}
.banner img{position:absolute; right:6px; bottom:-6px; width:180px; height:180px; object-fit:contain; filter:drop-shadow(0 8px 8px rgba(0,0,0,.2))}
.banner .round{background:rgba(255,255,255,.92); color:var(--ink); box-shadow:0 4px 0 rgba(0,0,0,.15)}
.banner-txt{flex:1; min-width:0}
.banner-prog{display:flex; flex-wrap:wrap; align-items:center; gap:10px 14px; margin-top:10px; max-width:480px}
.banner-prog .subj-prog{flex:1; min-width:200px}
.cupbtn{min-height:46px; border:0; border-radius:999px; padding:4px 16px; background:#fff; color:#232A4D; font-family:var(--f-display); font-weight:800; font-size:1.05rem; box-shadow:0 4px 0 rgba(0,0,0,.18),0 0 0 3px var(--star)}
.cupbtn:active{transform:translateY(3px)}
.acts{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px}
.act{display:grid; grid-template-columns:76px 1fr; gap:4px 16px; align-items:center; text-align:left; background:var(--card); border:0; border-radius:24px; padding:16px 18px;
  box-shadow:inset 0 -6px 0 var(--line),0 10px 22px var(--shadow); transition:transform .1s}
.act:active{transform:translateY(3px) scale(.99)}
.act-icon{grid-row:1/4; width:76px; height:76px; border-radius:24px; display:grid; place-items:center; font-size:2.4rem;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 30%,var(--card)),color-mix(in srgb,var(--c) 55%,var(--card))); box-shadow:inset 0 -5px 0 color-mix(in srgb,var(--c) 45%,var(--line))}
.act h3{font-size:1.4rem}
.act p{margin:0; color:var(--ink-soft); font-size:.95rem; line-height:1.3}
.stars{display:inline-flex; gap:3px; font-size:1.3rem; line-height:1}
.stars .on{color:var(--star); text-shadow:0 2px 0 color-mix(in srgb,var(--star) 60%,#000)} .stars .off{color:var(--star-off)}

/* juego */
.game{--c:var(--mates)}
.game-head{display:flex; align-items:center; gap:14px; margin-bottom:16px}
.game-title{flex:1; min-width:0}
.game-title h2{font-size:1.55rem; color:var(--c)}
.meter{display:flex; align-items:center; gap:12px; margin-top:8px; max-width:560px}
.m-count{flex:none; min-width:2.6em; font-family:var(--f-display); font-weight:800; font-size:1.05rem; color:var(--ink-soft); font-variant-numeric:tabular-nums}
.m-track{position:relative; flex:1; height:18px; margin:0 18px 0 4px; border-radius:10px; background:var(--card); box-shadow:inset 0 3px 0 var(--line),0 2px 6px var(--shadow)}
.m-fill{position:absolute; left:0; top:0; bottom:0; width:0; border-radius:10px; background:linear-gradient(180deg,#FFE27A,var(--star)); box-shadow:inset 0 -3px 0 rgba(0,0,0,.12); transition:width .7s cubic-bezier(.3,1.25,.5,1); overflow:hidden}
.m-fill::after{content:""; position:absolute; inset:0; background:linear-gradient(100deg,transparent 30%,rgba(255,255,255,.7) 50%,transparent 70%); transform:translateX(-100%)}
.m-fill.up::after{animation:shine .9s ease-out}
.m-star{position:absolute; top:50%; width:36px; height:36px; transform:translate(-50%,-50%); display:grid; place-items:center; border-radius:50%; background:var(--card); color:var(--star-off); font-size:1.4rem; line-height:1;
  box-shadow:0 3px 0 var(--line),0 4px 10px var(--shadow)}
.m-star.on{background:radial-gradient(circle at 35% 30%,#FFE9A0,var(--star) 70%); color:#fff; text-shadow:0 2px 0 rgba(0,0,0,.18); box-shadow:0 0 0 4px color-mix(in srgb,var(--star) 35%,transparent),0 4px 10px var(--shadow); animation:starpop .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes starpop{0%{transform:translate(-50%,-50%) scale(.5)}55%{transform:translate(-50%,-50%) scale(1.45) rotate(18deg)}100%{transform:translate(-50%,-50%) scale(1)}}
@keyframes shine{to{transform:translateX(100%)}}
.stage{position:relative; background:var(--card); border-radius:34px; padding:clamp(18px,3.4vw,36px); min-height:380px; display:flex; flex-direction:column; align-items:center; gap:22px;
  box-shadow:inset 0 -8px 0 color-mix(in srgb,var(--c) 22%,var(--line)),0 18px 40px var(--shadow)}
.stage::before{content:""; position:absolute; inset:0 0 auto; height:10px; border-radius:34px 34px 0 0; background:var(--c); opacity:.9}
.q-prompt{font-family:var(--f-display); font-weight:800; font-size:clamp(1.45rem,3.4vw,2rem); text-align:center; line-height:1.15; max-width:30ch}
.q-note{color:var(--ink-soft); text-align:center; margin:-12px 0 0; max-width:52ch}
.q-emoji{font-size:clamp(5rem,13vw,7rem); line-height:1; filter:drop-shadow(0 8px 6px var(--shadow)); animation:popin .45s cubic-bezier(.3,1.6,.5,1) both}
.q-big{font-family:var(--f-display); font-weight:800; font-size:clamp(3rem,10vw,4.6rem); line-height:1; font-variant-numeric:tabular-nums; color:var(--ink)}
.with-say{display:flex; align-items:center; gap:14px; justify-content:center; flex-wrap:wrap}
.tag{display:inline-block; font-family:var(--f-display); font-weight:800; font-size:1rem; padding:4px 14px; border-radius:999px; background:color-mix(in srgb,var(--c) 16%,var(--card)); color:var(--ink)}
.tag.think{background:color-mix(in srgb,var(--star) 30%,var(--card))}

.opts{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:16px; width:100%; max-width:660px}
.opts.wide{grid-template-columns:1fr; max-width:580px}
.opt{position:relative; min-height:82px; border-radius:22px; border:3px solid color-mix(in srgb,var(--c) 30%,var(--line)); background:var(--card); font-family:var(--f-read); font-weight:700;
  font-size:clamp(1.5rem,3.8vw,2.1rem); padding:8px 14px; box-shadow:inset 0 -6px 0 color-mix(in srgb,var(--c) 18%,var(--line)); transition:transform .08s}
.opts.wide .opt{font-size:1.3rem; text-align:left; padding:14px 20px}
.opt:active{transform:translateY(3px) scale(.98)}
.opt.ok{background:var(--ok-bg); border-color:var(--ok); box-shadow:inset 0 -6px 0 color-mix(in srgb,var(--ok) 50%,var(--card)); animation:bounce .5s}
.opt.ko{background:var(--ko-bg); border-color:var(--ko); box-shadow:none; opacity:.55; pointer-events:none; text-decoration:line-through; animation:shake .35s}
.opt.lock{pointer-events:none}
.burst{position:absolute; left:50%; top:50%; pointer-events:none; color:var(--star); font-size:22px; animation:burst .7s ease-out forwards}

.word{display:flex; align-items:flex-end; flex-wrap:wrap; justify-content:center; font-size:clamp(2.8rem,8vw,4.2rem); font-weight:700; letter-spacing:.04em; line-height:1.1}
.gap{display:inline-block; min-width:1.2em; padding:0 .12em; margin:0 .06em; border-bottom:6px dashed var(--c); color:var(--c); text-align:center}
.gap.fill{border-bottom-style:solid; border-color:var(--ok); color:var(--ok); animation:bounce .5s}
.gap.empty::before{content:"?"; opacity:.35}

.ans{min-width:3.4em; padding:4px 18px; border-radius:20px; border:4px dashed var(--c); background:var(--paper); font-size:clamp(2.6rem,7vw,3.5rem); font-weight:700; text-align:center; font-variant-numeric:tabular-nums; line-height:1.2}
.ans.empty{color:var(--ink-soft); opacity:.55}
.ans.good{border-style:solid; border-color:var(--ok); color:var(--ok); background:var(--ok-bg); animation:bounce .5s}
.ans.bad{border-color:var(--ko); color:var(--ko); animation:shake .35s}
.keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:100%; max-width:350px}
.key{min-height:66px; border-radius:20px; border:0; background:var(--paper); font-family:var(--f-display); font-size:2rem; font-weight:800; font-variant-numeric:tabular-nums;
  box-shadow:inset 0 -6px 0 var(--line),0 4px 10px var(--shadow)}
.key:active{transform:translateY(3px); box-shadow:inset 0 -2px 0 var(--line)}
.key.ok{background:linear-gradient(180deg,color-mix(in srgb,var(--ok) 75%,#fff),var(--ok)); color:#fff; box-shadow:inset 0 -6px 0 color-mix(in srgb,var(--ok) 65%,#000)}
.key.del{font-size:1.5rem}
.split{display:flex; flex-wrap:wrap; gap:24px 40px; align-items:center; justify-content:center; width:100%}

.colop{display:grid; gap:6px; font-variant-numeric:tabular-nums; justify-content:center}
.cell{width:clamp(54px,11vw,70px); height:clamp(58px,11vw,74px); display:grid; place-items:center; font-size:clamp(2.1rem,6vw,2.9rem); font-weight:700; border-radius:14px}
.cell.in{border:4px dashed var(--c); background:var(--paper)}
.cell.carry{height:42px; font-size:1.4rem; border:3px dashed color-mix(in srgb,var(--c) 40%,var(--line)); color:var(--ink-soft); background:transparent}
.cell.sel{border-style:solid; box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 25%,transparent)}
.cell.bad{border-color:var(--ko); color:var(--ko); background:var(--ko-bg)}
.cell.good{border-color:var(--ok); color:var(--ok); background:var(--ok-bg)}
.cell.sign{color:var(--c)}
.opline{grid-column:1/-1; height:6px; border-radius:3px; background:var(--ink)}
.carry-lbl{grid-column:1/-1; font-size:.85rem; color:var(--ink-soft); text-align:right; margin-bottom:-4px}

.blocks{display:flex; flex-wrap:wrap; gap:18px; align-items:flex-end; justify-content:center; max-width:740px}
.bgroup{display:flex; flex-wrap:wrap; gap:6px; align-items:flex-end; max-width:340px}
.blk-c{width:92px; height:92px; background-color:var(--mates); border-radius:6px; box-shadow:inset 0 -4px 0 rgba(0,0,0,.2);
  background-image:linear-gradient(rgba(255,255,255,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.35) 1px,transparent 1px); background-size:9.2px 9.2px}
.blk-d{width:12px; height:92px; background-color:var(--cono); border-radius:5px; box-shadow:inset -2px -3px 0 rgba(0,0,0,.2); background-image:linear-gradient(rgba(255,255,255,.35) 1px,transparent 1px); background-size:100% 9.2px}
.blk-u{width:14px; height:14px; background:var(--lectura); border-radius:4px; box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.blk-legend{display:flex; flex-wrap:wrap; gap:6px 18px; justify-content:center; color:var(--ink-soft); font-size:.95rem}

.groups{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; max-width:720px}
.grp{min-width:56px; min-height:56px; padding:6px 8px; border-radius:18px; display:flex; flex-wrap:wrap; gap:2px; align-items:center; justify-content:center; font-size:1.35rem; max-width:112px;
  background:color-mix(in srgb,var(--c) 10%,var(--card)); border:3px solid color-mix(in srgb,var(--c) 45%,var(--line))}
.grp.empty{border-style:dashed}

.numline{width:100%; max-width:660px; height:auto; overflow:visible}
.numline .axis{stroke:var(--ink); stroke-width:5; stroke-linecap:round}
.numline .tick{stroke:var(--ink-soft); stroke-width:2.5}
.numline .tick.mid{stroke:var(--ink); stroke-width:3.5}
.numline text{fill:var(--ink); font-family:var(--f-read); font-weight:700; font-size:22px}
.numline .mark{fill:var(--c)} .numline .mark-t{fill:var(--c); font-size:28px; font-family:var(--f-display); font-weight:800}

.tiles{display:flex; flex-wrap:wrap; gap:12px; justify-content:center; max-width:660px}
.tile{min-width:78px; min-height:78px; padding:6px 18px; border-radius:20px; border:0; color:var(--on-c); font-size:2.1rem; font-weight:700; text-shadow:0 2px 0 rgba(0,0,0,.15);
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 75%,#fff),var(--c)); box-shadow:inset 0 -6px 0 color-mix(in srgb,var(--c) 68%,#000),0 6px 12px color-mix(in srgb,var(--c) 30%,transparent)}
.tile:active{transform:translateY(3px) scale(.97)}
.tile.used{visibility:hidden}
.slots{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; min-height:80px}
.slot{min-width:62px; height:76px; padding:0 10px; border-bottom:6px solid var(--line); display:grid; place-items:center; font-size:2.5rem; font-weight:700}
.slot.on{border-color:var(--c); animation:popin .3s both}
.slots.good .slot{border-color:var(--ok); color:var(--ok)}

.sentence{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; max-width:740px}
.wchip{min-height:66px; padding:6px 16px; border-radius:18px; border:3px solid var(--line); background:var(--paper); font-size:clamp(1.55rem,4vw,2.05rem); font-weight:700; box-shadow:inset 0 -5px 0 var(--line)}
.wchip.cap{border-color:var(--c); background:color-mix(in srgb,var(--c) 14%,var(--card)); animation:bounce .35s}
.wchip.err{border-color:var(--ko); background:var(--ko-bg); animation:shake .35s}
.wchip.good{border-color:var(--ok); background:var(--ok-bg)}
.wchip.punct{border:0; background:none; box-shadow:none; padding-inline:0; pointer-events:none}

.readtext{width:100%; max-width:68ch; background:var(--paper); border-radius:22px; padding:18px 24px 18px 34px; font-size:clamp(1.2rem,2.6vw,1.38rem); line-height:2; position:relative;
  background-image:linear-gradient(transparent calc(2em - 2px),var(--rule) calc(2em - 2px),var(--rule) 2em); background-size:100% 2em; background-position:0 18px;
  box-shadow:inset 0 -5px 0 var(--line); border-left:6px solid color-mix(in srgb,var(--lengua) 55%,transparent)}
.readtext h3{font-size:1.6rem; line-height:2em; color:var(--c)}
.readtext p{margin:0}
.qlist{width:100%; max-width:62ch; margin:0; padding-left:0; list-style:none; display:grid; gap:10px}
.qlist li{display:flex; align-items:center; gap:12px; background:var(--paper); border-radius:18px; padding:10px 14px; font-size:1.2rem; font-weight:700; box-shadow:inset 0 -4px 0 var(--line)}
.listen{width:160px; height:160px; border-radius:50%; border:0; color:#fff; font-size:3.8rem; background:linear-gradient(180deg,color-mix(in srgb,var(--c) 75%,#fff),var(--c));
  box-shadow:inset 0 -9px 0 color-mix(in srgb,var(--c) 68%,#000),0 14px 26px color-mix(in srgb,var(--c) 35%,transparent)}
.listen.playing{animation:pulse 1.1s infinite}

.memory{display:grid; grid-template-columns:repeat(4,1fr); gap:12px; width:100%; max-width:min(560px,calc((100vh - 270px) * 1.33))}
.card{aspect-ratio:1/1; max-width:100%; border:0; padding:0; background:none; perspective:700px}
.card-in{display:block; position:relative; width:100%; height:100%; transition:transform .4s cubic-bezier(.3,1.4,.5,1); transform-style:preserve-3d}
.card.up .card-in,.card.done .card-in{transform:rotateY(180deg)}
.face,.backf{position:absolute; inset:0; border-radius:20px; display:grid; place-items:center; backface-visibility:hidden; -webkit-backface-visibility:hidden}
.backf{background:linear-gradient(160deg,color-mix(in srgb,var(--c) 72%,#fff),var(--c)); color:#fff; font-family:var(--f-display); font-size:2.4rem; font-weight:800;
  box-shadow:inset 0 -6px 0 color-mix(in srgb,var(--c) 68%,#000)}
.backf img{width:62%; opacity:.95}
.face{transform:rotateY(180deg); background:var(--card); border:4px solid var(--c); font-size:clamp(1.35rem,4vw,2rem); font-weight:700}
.face.emo{font-size:clamp(2.6rem,7vw,3.6rem)}
.card.done .face{border-color:var(--ok); background:var(--ok-bg); animation:bounce .5s}

.timer{position:relative; width:min(300px,70vw); aspect-ratio:1/1}
.timer svg{width:100%; height:100%; transform:rotate(-90deg)}
.timer .trk{stroke:var(--star-off); fill:none; stroke-width:20}
.timer .val{stroke:var(--c); fill:none; stroke-width:20; stroke-linecap:round; transition:stroke-dashoffset .3s linear}
.timer .time{position:absolute; inset:0; display:grid; place-items:center; font-family:var(--f-display); font-weight:800; font-size:clamp(3rem,10vw,4.3rem); font-variant-numeric:tabular-nums}
.read-wrap{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:10px 30px}
.read-wrap .mochi{width:clamp(130px,22vw,190px)}
.week{display:flex; gap:8px; flex-wrap:wrap; justify-content:center}
.day{width:54px; height:64px; border-radius:16px; display:grid; place-items:center; font-weight:700; background:var(--paper); line-height:1; box-shadow:inset 0 -4px 0 var(--line)}
.day small{font-size:.8rem; color:var(--ink-soft)}
.day.done{background:var(--ok-bg); color:var(--ok); box-shadow:inset 0 -4px 0 color-mix(in srgb,var(--ok) 40%,var(--card))}
.day.today{outline:3px solid var(--c); outline-offset:2px}
.askcard{width:100%; max-width:62ch; background:var(--paper); border-radius:22px; padding:16px 22px; box-shadow:inset 0 -5px 0 var(--line)}
.askcard h3{font-size:1.3rem; margin-bottom:6px}
.askcard ul{margin:0; padding-left:22px}

/* preparar, final, perfiles */
.setup,.end{display:flex; flex-direction:column; align-items:center; gap:18px; text-align:center; padding-block:8px}
.setup-icon{width:120px; height:120px; border-radius:36px; display:grid; place-items:center; font-size:4.2rem;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 30%,var(--card)),color-mix(in srgb,var(--c) 60%,var(--card))); box-shadow:inset 0 -7px 0 color-mix(in srgb,var(--c) 50%,var(--line)); animation:popin .5s cubic-bezier(.3,1.6,.5,1) both}
.setup h2{font-size:clamp(2rem,5vw,2.6rem)}
.setup p{margin:0; max-width:48ch; color:var(--ink-soft); font-size:1.15rem}
.chips{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; max-width:660px}
.chip{min-height:56px; padding:6px 22px; border-radius:999px; border:0; background:var(--paper); font-weight:700; font-size:1.15rem; box-shadow:inset 0 -4px 0 var(--line)}
.chip.on{background:var(--c); color:#fff; box-shadow:inset 0 -4px 0 color-mix(in srgb,var(--c) 65%,#000)}
.end .mochi{width:clamp(170px,30vw,230px)}
.end h2{font-size:clamp(2.2rem,6vw,3rem)}
.end-stars{display:flex; gap:10px; font-size:clamp(4.2rem,14vw,5.6rem); line-height:1; margin-bottom:-10px}
.end-stars span{color:var(--star-off)}
.end-stars span.on{color:var(--star); text-shadow:0 5px 0 color-mix(in srgb,var(--star) 55%,#000); animation:popin .6s cubic-bezier(.3,1.6,.5,1) backwards}
.end-stars span:nth-child(2){animation-delay:.25s; transform:translateY(-14px)} .end-stars span:nth-child(3){animation-delay:.5s}
.end p{margin:0; font-size:1.2rem; color:var(--ink-soft)}
.stars.big{font-size:clamp(2.6rem,7vw,3.4rem); gap:6px}
.form{max-width:700px; margin:6px auto; display:flex; flex-direction:column; gap:18px}
.form .hero{margin:0}
.form .panel{background:var(--card); border-radius:var(--r); padding:24px; display:flex; flex-direction:column; gap:14px; box-shadow:inset 0 -7px 0 var(--line),0 14px 30px var(--shadow)}
.form label{font-family:var(--f-display); font-weight:800; font-size:1.3rem}
.form input{width:100%; min-height:68px; border-radius:20px; border:3px solid var(--line); background:var(--paper); color:var(--ink); font:inherit; font-size:1.7rem; padding:6px 18px}
.avatars{display:grid; grid-template-columns:repeat(auto-fill,minmax(74px,1fr)); gap:10px}
.avb{aspect-ratio:1/1; border-radius:22px; border:0; background:var(--paper); font-size:2.3rem; box-shadow:inset 0 -5px 0 var(--line)}
.avb.on{background:color-mix(in srgb,var(--sun) 55%,var(--card)); box-shadow:inset 0 -5px 0 color-mix(in srgb,var(--sun) 60%,#000),0 0 0 4px var(--sun); animation:bounce .4s}
.profiles{display:grid; grid-template-columns:repeat(auto-fill,minmax(190px,1fr)); gap:16px}
.prof{display:flex; flex-direction:column; align-items:center; gap:6px; padding:20px 10px; border-radius:var(--r); border:0; background:var(--card); font-weight:700; font-size:1.25rem; box-shadow:inset 0 -6px 0 var(--line),0 10px 22px var(--shadow)}
.prof .av{font-size:3rem; width:86px; height:86px; display:grid; place-items:center; border-radius:50%; background:color-mix(in srgb,var(--sun) 40%,var(--card))}

/* hoja de corrección con Mochi */
.fb{position:fixed; left:0; right:0; bottom:0; z-index:20; padding:12px 16px calc(14px + env(safe-area-inset-bottom,0px)); transform:translateY(120%); transition:transform .28s cubic-bezier(.3,1.3,.5,1)}
.fb.show{transform:none}
.fb-in{max-width:1000px; margin:0 auto; display:flex; align-items:center; gap:14px; flex-wrap:wrap; border-radius:28px; padding:12px 18px 12px 12px; background:var(--card); border:4px solid; box-shadow:0 -6px 30px var(--shadow)}
.fb.ok .fb-in{border-color:var(--ok); background:linear-gradient(180deg,var(--ok-bg),var(--card))}
.fb.ko .fb-in{border-color:var(--ko); background:linear-gradient(180deg,var(--ko-bg),var(--card))}
.fb-img{width:84px; height:84px; object-fit:contain; flex:none; margin-top:-34px; filter:drop-shadow(0 6px 6px var(--shadow))}
.fb.ok .fb-img{animation:bounce .6s}
.fb.ko .fb-img{animation:wiggle .6s}
.fb-text{flex:1; min-width:180px}
.fb-text strong{display:block; font-family:var(--f-display); font-size:1.7rem; line-height:1.1}
.fb.ok strong{color:var(--ok)} .fb.ko strong{color:var(--ko)}
.fb-text span{font-size:1.15rem}
.fb .btn{--c:var(--ok)}

#confetti{position:fixed; inset:0; pointer-events:none; z-index:60}
/* trofeo con vídeo */
.reward{position:fixed; inset:0; z-index:50; display:grid; place-items:center; padding:16px; background:radial-gradient(circle at 50% 38%,rgba(255,210,80,.38),rgba(16,22,46,.82) 72%); animation:fadein .25s both}
.reward.out{animation:fadein .25s reverse both}
.rw-card{--c:var(--mates); width:min(860px,100%); max-height:calc(100vh - 32px); max-height:calc(100dvh - 32px); overflow:auto; background:var(--card); border-radius:34px; padding:18px 22px 22px;
  display:flex; flex-direction:column; align-items:center; gap:16px; box-shadow:inset 0 -9px 0 color-mix(in srgb,var(--c) 35%,var(--line)),0 30px 80px rgba(0,0,0,.45); animation:popin .55s cubic-bezier(.3,1.45,.5,1) both}
.rw-head{display:flex; align-items:center; gap:14px; align-self:stretch}
.rw-cup{font-size:clamp(3.2rem,8vw,4.4rem); line-height:1; filter:drop-shadow(0 6px 6px var(--shadow)); animation:wiggle 1s .5s 2}
.rw-head h2{font-size:clamp(1.8rem,4.6vw,2.7rem); color:var(--c)}
.rw-head p{margin:2px 0 0; color:var(--ink-soft); font-size:1.12rem}
.rw-frame{width:100%; aspect-ratio:16/9; border-radius:24px; overflow:hidden; background:#000; box-shadow:0 0 0 6px var(--star),0 14px 30px var(--shadow)}
.rw-video{width:100%; height:100%; object-fit:cover; display:block}
@keyframes fadein{from{opacity:0}}
.shake{animation:shake .35s}
@keyframes shake{20%{transform:translateX(-8px)}40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
@keyframes float{50%{transform:translateY(-8px) rotate(-1.5deg)}}
@keyframes popin{from{transform:scale(.2) rotate(-12deg); opacity:0}}
@keyframes bounce{30%{transform:scale(1.12,.9)}55%{transform:scale(.94,1.08) translateY(-6px)}80%{transform:scale(1.03,.98)}}
@keyframes wiggle{20%{transform:rotate(-8deg)}40%{transform:rotate(7deg)}60%{transform:rotate(-5deg)}80%{transform:rotate(3deg)}}
@keyframes pulse{50%{transform:scale(1.07)}}
@keyframes burst{from{transform:translate(-50%,-50%) scale(.4); opacity:1}to{transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(1.1) rotate(160deg); opacity:0}}
@media (prefers-reduced-motion: reduce){ *{animation:none!important; transition:none!important} }
@media (max-width:600px){
  body{font-size:17px}
  .memory{grid-template-columns:repeat(3,1fr)}
  .brand span{display:none}
  .hero{grid-template-columns:1fr; justify-items:center}
  .hero .bubble::before{display:none}
  .subj-img{width:120px; height:120px; top:-22px}
  .banner{padding-right:130px} .banner img{width:140px; height:140px}
  .fb-img{width:64px; height:64px}
}

/* ---- ajustes para iPad: barra compacta, dos columnas en horizontal, avisos que no tapan ---- */
html{touch-action:manipulation; -webkit-text-size-adjust:100%}
.subj:hover .subj-img{transform:none}
@media (hover:hover){ .subj:hover .subj-img{transform:rotate(-6deg) scale(1.05)} }
.game-head{margin-top:4px}
.gh-tools{display:flex; gap:10px; align-items:center; margin-left:auto; flex:none}
.gh-tools .pill{padding-right:14px}
.stage{min-height:calc(100vh - 120px); min-height:calc(100dvh - 120px); justify-content:center}
.pane2{display:flex; flex-direction:column; align-items:center; gap:22px; width:100%}
.pane{display:flex; flex-direction:column; align-items:center; gap:18px; min-width:0; width:100%}
.memory{max-width:min(640px,calc((100vh - 250px) * 1.33)); max-width:min(640px,calc((100dvh - 250px) * 1.33))}
.opt{overflow-wrap:anywhere}
.opts.words{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opts.words .opt{font-size:clamp(1.2rem,2.3vw,1.5rem)}
.read-layout{display:flex; flex-direction:column; align-items:center; gap:18px; width:100%}
.read-side{display:flex; flex-direction:column; align-items:center; gap:16px; width:100%}
@media (min-width:900px) and (orientation:landscape){
  .pane2{display:grid; grid-template-columns:minmax(0,1.1fr) minmax(0,1fr); align-items:center; gap:24px 40px}
  .pane2.text{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr); align-items:start}
  .pane2.text .readtext{font-size:1.25rem}
  .memory{grid-template-columns:repeat(6,1fr); max-width:min(940px,calc((100vh - 230px) * 3)); max-width:min(940px,calc((100dvh - 230px) * 3))}
  .read-layout{display:grid; grid-template-columns:auto minmax(0,1fr); gap:24px 40px; align-items:center}
}
.toast{position:fixed; z-index:25; left:50%; top:calc(env(safe-area-inset-top,0px) + 12px); width:min(560px,calc(100% - 32px)); transform:translate(-50%,-170%);
  transition:transform .3s cubic-bezier(.3,1.3,.5,1); display:flex; align-items:center; gap:12px; padding:10px 18px 10px 10px; border-radius:24px;
  background:linear-gradient(180deg,var(--ko-bg),var(--card)); border:4px solid var(--ko); box-shadow:0 12px 30px var(--shadow); cursor:pointer}
.toast.show{transform:translate(-50%,0)}
.toast img{width:62px; height:62px; object-fit:contain; flex:none; animation:wiggle .6s}
.toast strong{display:block; font-family:var(--f-display); font-size:1.45rem; color:var(--ko); line-height:1.1}
.toast span{font-size:1.05rem}
.backup{display:grid; gap:10px; margin-bottom:18px; max-width:72ch}
.backup h3{font-size:1.15rem}
.backup textarea{width:100%; min-height:84px; border-radius:16px; border:3px solid var(--line); background:var(--paper); color:var(--ink); font:inherit; font-size:.95rem; padding:10px 12px; -webkit-user-select:text; user-select:text}
.backup .btn{min-height:52px; font-size:1.1rem; padding-inline:20px}
.backup .msg{font-weight:700; color:var(--ok)}
.backup .msg.err{color:var(--ko)}
@media (max-width:600px){ .gh-tools .pill .coin{font-size:1rem} }
@media (max-width:640px){
  .game-head{flex-wrap:wrap; row-gap:8px}
  .game-title{order:3; flex-basis:100%}
  .game-title h2{font-size:1.35rem}
  .meter{max-width:none}
}
.read-side .week{gap:6px; flex-wrap:nowrap}
.read-side .day{width:46px; height:58px}
@media (max-width:420px){ .read-side .day{width:40px} .read-side .week{gap:4px} }

/* ---- Conocimiento del medio: mapa, álbum y fichas ---- */
.subj.long .subj-name{font-size:1.6rem; padding-right:92px}
.subj.long .subj-img{width:122px; height:122px; top:-26px; right:-6px}
.subj.long .subj-blurb{padding-right:84px}
.ani-row{display:flex; flex-wrap:wrap; align-items:center; justify-content:center; gap:10px 22px; width:100%}
.q-emoji.small{font-size:clamp(3.4rem,8vw,4.6rem)}
.ani-img{width:clamp(110px,18vw,160px); height:auto; object-fit:contain}
.ani-img.small{width:clamp(80px,12vw,110px)}
.map{position:relative; width:100%; max-width:860px; aspect-ratio:1100/615; border-radius:28px; overflow:hidden; box-shadow:0 10px 26px var(--shadow)}
.map img{width:100%; height:100%; object-fit:cover}
.cont{position:absolute; transform:translate(-50%,-50%); min-height:46px; padding:6px 14px; border-radius:999px; border:3px solid #fff; background:rgba(255,255,255,.94); color:#232A4D;
  font-family:var(--f-display); font-weight:800; font-size:clamp(.8rem,1.7vw,1.1rem); white-space:nowrap; box-shadow:0 4px 0 rgba(0,0,0,.18),0 6px 14px rgba(0,0,0,.18)}
.cont:active{transform:translate(-50%,-50%) scale(.95)}

/* emojis dentro de círculos y cuadrados: centrados con la medida del propio emoji */

function h(tag,a,...kids){
  const el=document.createElement(tag);
  if(a) for(const k in a){
    const v=a[k]; if(v==null||v===false) continue;
    if(k==='class') el.className=v;
    else if(k.startsWith('on')&&typeof v==='function') el.addEventListener(k.slice(2),v);
    else if(k==='style'&&typeof v==='object') Object.assign(el.style,v);
    else el.setAttribute(k,v===true?'':v);
  }
  for(const c of kids.flat(Infinity)) if(c!=null&&c!==false) el.append(c.nodeType?c:document.createTextNode(String(c)));
  return el;
}

function starsOf(p,id){return p?Math.min((p.stars&&p.stars[id])||0,gmax(GAMES[id])):0;}

40.96,1.52],"El sol calienta mucho.":[3,42.78,1.56],"Dame el lápiz rojo.":[3,44.64,1.28],"Los niños se ríen mucho.":[3,46.22,1.64],"Mañana voy al cine.":[3,48.16,1.28],"La niña salta a la comba.":[3,49.74,1.64],"Echa un poco de sal a la sopa.":[3,51.68,1.74],"Me gustan las fresas.":[3,53.72,1.46],"Mi casa es grande.":[3,55.48,1.24],"El perro ladra.":[3,57.02,1.12],"Ese es mi libro.":[3,58.44,1.16],"Lucía tiene 383 cromos.":[3,59.9,2.82],"A Hugo le quedan 217 canicas.":[3,63.02,2.82],"En total hay 283 galletas.":[3,66.14,2.66],"En el tren quedan 255 pasajeros.":[3,69.1,3.08],"Martina ha leído 125 páginas en total.":[3,72.48,3.14],"En el zoo quedan 54 pájaros.":[3,75.92,2.48],"A Leo le faltan 174 pegatinas.":[3,78.7,2.84],"Ese día van al cine 623 personas.":[3,81.84,3.24],"En el huerto hay 121 plantas.":[3,85.38,2.5],"A Sofía le quedan 66 euros.":[3,88.18,2.42],"En el colegio hay 611 alumnos.":[3,90.9,2.54],"A la granja le quedan 355 gallinas.":[3,93.74,3.18],"¿Dónde duerme Pincho durante el día?":[4,0.3,1.94],"¿Qué come Pincho?":[4,2.54,1.18],"¿Por qué se convierte Pincho en una bola de púas?":[4,4.02,2.7],"¿Qué tiempo había hecho la noche antes de que la abuela viera las huellas?":[4,7.02,3.46],"¿Cuántos años cumple Leo?":[4,10.78,1.52],"¿Dónde juegan al escondite?":[4,12.6,1.6],"¿Cuántos amigos del cole van a la fiesta?":[4,14.5,2.26],"¿Cómo se siente Leo al final del día?":[4,17.06,2.04],"¿Para qué estira el cuello la jirafa?":[4,19.4,1.78],"¿Cuántas patas tiene la araña?":[4,21.48,1.76],"¿Tiene huesos la jirafa?":[4,23.54,1.42],"¿Qué necesitan los pingüinos en el zoo?":[4,25.26,2.0],"¿Qué quería hacer Marta?":[4,27.56,1.34],"¿Qué sacó el abuelo?":[4,29.2,1.18],"¿Cómo se sentía Marta al mirar por la ventana?":[4,30.68,2.44],"Al final, ¿se lo pasó bien Marta?":[4,33.42,2.28],"¿Qué hacía la hormiga en verano?":[4,36.0,1.6],"¿Qué instrumento tocaba el saltamontes?":[4,37.9,2.18],"¿Por qué llamó el saltamontes a la puerta de la hormiga?":[4,40.38,2.64],"¿Quién pensó antes en el invierno?":[4,43.32,1.82],"¿De qué color es Burbuja?":[4,45.44,1.5],"¿Cuándo le da de comer Daniel?":[4,47.24,1.54],"¿Qué le puso Daniel en la pecera?":[4,49.08,1.78],"¿Le gusta a Burbuja el barco?":[4,51.16,1.68],"¿Qué día fueron de excursión?":[4,53.14,1.6],"¿Cómo llegaron al castillo?":[4,55.04,1.54],"¿Quién vivió en el castillo hace muchos años?":[4,56.88,2.62],"¿Por qué Nora sujetaba la gorra con la mano?":[4,59.8,2.34],"¿Cómo es Pelusa?":[4,62.44,1.12],"¿Dónde le gusta dormir?":[4,63.86,1.38],"¿Qué dejó la abuela encima del sofá?":[4,65.54,1.96],"¿Cómo estaba el salón cuando volvió la abuela?":[4,67.8,2.218],"Lucía tiene 245 cromos. Su abuela le regala 138 cromos más. ¿Cuántos cromos tiene ahora?":[5,0.3,7.36],"Hugo tenía 362 canicas y le da 145 a sus amigos. ¿Cuántas canicas le quedan?":[5,7.96,6.44],"En una caja hay 156 galletas y en otra caja hay 127. ¿Cuántas galletas hay en total?":[5,14.7,6.82],"Un tren lleva 430 pasajeros. En la estación se bajan 175. ¿Cuántos pasajeros quedan en el tren?":[5,21.82,7.36],"Martina leyó 68 páginas la semana pasada y 57 páginas esta semana. ¿Cuántas páginas ha leído en total?":[5,29.48,7.48],"En el zoo hay 92 pájaros. Se van volando 38. ¿Cuántos pájaros quedan?":[5,37.26,5.36],"Leo quiere juntar 500 pegatinas. Ya tiene 326. ¿Cuántas pegatinas le faltan?":[5,42.92,6.1],"Al cine van 248 personas por la mañana y 375 por la tarde. ¿Cuántas personas van al cine ese día?":[5,49.32,7.96],"En el huerto del cole hay 75 lechugas y 46 tomateras. ¿Cuántas plantas hay en total?":[5,57.58,5.9],"Sofía tenía 85 euros en su hucha. Se compra un libro de 19 euros. ¿Cuánto dinero le queda?":[5,63.78,6.66],"En el colegio hay 315 niños y 296 niñas. ¿Cuántos alumnos hay en total?":[5,70.74,6.06],"Una granja tiene 640 gallinas. Vende 285. ¿Cuántas gallinas le quedan?":[5,77.1,6.371],"Pincho es un erizo pequeño que vive en el jardín de la abuela Carmen. Por el día duerme debajo de un montón de hojas secas. Cuando se hace de noche, sale a buscar caracoles y gusanos para comer. Si un perro se acerca, Pincho se convierte en una bola llena de púas. Una mañana, la abuela encontró sus huellas en la tierra mojada.":[6,0.3,19.566],"Hoy Leo cumple siete años. Su madre ha preparado una tarta de chocolate con siete velas. A la fiesta vienen sus amigos del cole: Sara, Iván y Nora. Juegan al escondite en el patio hasta que se hace de noche. Cuando Leo sopla las velas, todos aplauden. Antes de dormir, Leo dice: «¡Ha sido el mejor día del año!».":[6,20.166,19.859],"La clase de segundo fue de visita al zoo. La jirafa estiraba su cuello largo para comer las hojas más altas. Los pingüinos nadaban muy rápido, pero ninguno echaba a volar. En el terrario había una araña enorme con ocho patas y una mariposa azul. La seño explicó que la araña y la mariposa no tienen huesos: son animales invertebrados.":[6,40.325,19.879],"Marta quería ir al parque con su bici nueva, pero empezó a llover muy fuerte. Se quedó mirando por la ventana con la cara muy seria. Entonces su abuelo sacó una caja de pinturas y un montón de folios. Pasaron la tarde pintando dragones, castillos y barcos. Cuando salió el arcoíris, Marta ya no se acordaba de la bici.":[6,60.504,18.22],"Durante todo el verano, la hormiga trabajaba sin parar y guardaba comida en su hormiguero. El saltamontes, en cambio, se pasaba el día cantando y tocando la guitarra. «¿Por qué trabajas tanto?», le preguntaba. Cuando llegó el invierno, hacía mucho frío y en el campo no quedaba comida. Una mañana, el saltamontes llamó a la puerta de la hormiga con la tripa vacía.":[6,79.024,22.58],"Burbuja es un pez naranja que vive en una pecera redonda, en casa de Daniel. Todas las mañanas, antes de ir al cole, Daniel le echa un poquito de comida. A Burbuja le encanta esconderse detrás de una piedra verde. Un sábado, Daniel limpió la pecera y le puso un barco pirata pequeñito. Desde ese día, Burbuja nada sin parar alrededor del barco.":[6,101.904,21.159],"El viernes, la clase de segundo fue de excursión a un castillo muy antiguo. Subieron en autobús por una carretera llena de curvas. Arriba, el guía les enseñó la torre más alta y les contó que allí vivieron caballeros hace muchísimos años. Hacía mucho viento y Nora tuvo que sujetar su gorra con la mano. Antes de volver, se comieron los bocadillos sentados junto a la muralla.":[6,123.363,22.007],"Pelusa es una gatita blanca con una mancha negra en la oreja. Le encanta dormir al sol en la terraza. Una tarde, la abuela dejó un ovillo de lana roja encima del sofá. Pelusa dio un salto, lo tiró al suelo y empezó a jugar con él. Cuando la abuela volvió, ¡había lana roja por todo el salón!":[6,145.671,17.868],"en:cat":[7,0.3,0.82],"en:dog":[7,1.42,0.82],"en:fish":[7,2.54,0.74],"en:bird":[7,3.58,0.82],"en:duck":[7,4.7,0.8],"en:cow":[7,5.8,0.76],"en:pig":[7,6.86,0.7],"en:frog":[7,7.86,0.7],"en:lion":[7,8.86,0.94],"en:bee":[7,10.1,0.74],"en:bear":[7,11.14,0.82],"en:mouse":[7,12.26,1.0],"en:apple":[7,13.56,0.76],"en:banana":[7,14.62,0.92],"en:egg":[7,15.84,0.72],"en:milk":[7,16.86,0.78],"en:cake":[7,17.94,0.76],"en:pizza":[7,19.0,0.78],"en:bread":[7,20.08,0.78],"en:cheese":[7,21.16,0.98],"en:orange":[7,22.44,0.92],"en:grapes":[7,23.66,0.98],"en:sun":[7,24.94,0.8],"en:star":[7,26.04,0.9],"en:moon":[7,27.24,0.8],"en:tree":[7,28.34,0.7],"en:car":[7,29.34,0.76],"en:bus":[7,30.4,0.96],"en:ball":[7,31.66,0.84],"en:book":[7,32.8,0.82],"en:pen":[7,33.92,0.72],"en:bed":[7,34.94,0.72],"en:house":[7,35.96,0.94],"en:hat":[7,37.2,0.82],"en:kite":[7,38.32,0.78],"en:bike":[7,39.4,0.82],"en:red":[7,40.52,0.7],"en:blue":[7,41.52,0.84],"en:green":[7,42.66,0.86],"en:yellow":[7,43.82,0.78],"en:purple":[7,44.9,0.8],"en:black":[7,46.0,0.86],"en:white":[7,47.16,0.8],"en:brown":[7,48.26,0.86],"¿En qué continente vive? Tócalo en el mapa.":[8,0.3,2.9],"¿Dónde vive este animal? Elige su casa.":[8,3.5,2.76],"¿Qué come este animal?":[8,6.56,1.26],"¿Cómo nace: de la tripa de su madre o de un huevo?":[8,8.12,2.94],"¿Verdadero o falso?":[8,11.36,1.4],"Este es tu álbum de animales. Cada vez que aciertas una pregunta de animales, consigues un cromo nuevo. Toca un cromo para ver su ficha.":[8,13.06,7.74],"Conocimiento del medio":[8,21.1,1.48],"La selva es un bosque muy caluroso y húmedo, lleno de árboles y de lluvia.":[8,22.88,4.28],"La sabana es una llanura enorme de hierba alta, con pocos árboles.":[8,27.46,3.68],"En el desierto casi nunca llueve y hay mucha arena.":[8,31.44,3.0],"En los polos hace muchísimo frío y casi todo está cubierto de hielo.":[8,34.74,4.2],"Los océanos son mares inmensos de agua salada.":[8,39.24,3.02],"Los ríos y los lagos tienen agua dulce.":[8,42.56,2.4],"En el bosque hay muchos árboles y en invierno hace frío.":[8,45.26,3.14],"En la montaña hay rocas, cuestas empinadas y mucho frío en lo alto.":[8,48.7,4.28],"En la granja viven animales que cuidan las personas.":[8,53.28,2.84],"Los herbívoros comen plantas: hierba, hojas, semillas y frutas.":[8,56.42,4.6],"Los carnívoros comen otros animales.":[8,61.32,2.16],"Los omnívoros comen de todo: plantas y animales.":[8,63.78,3.12],"Los vivíparos nacen de la tripa de su madre.":[8,67.2,2.44],"Los ovíparos nacen de un huevo.":[8,69.94,1.94],"Vive en África, en las selvas del Congo y de otros países cercanos.":[8,72.18,3.94],"Es el mono más grande del mundo y vive en familias. Come sobre todo hojas, tallos y frutas.":[8,76.42,6.42],"Vive en África, en la sabana, por ejemplo en Kenia y Tanzania.":[8,83.14,3.64],"Vive en grupos llamados manadas. Las leonas son las que más cazan.":[8,87.08,4.38],"Vive en África, en la sabana.":[8,91.76,1.92],"Es el animal más alto del mundo. Con su cuello largo come las hojas de los árboles más altos.":[8,93.98,5.78],"El elefante africano vive en África, en la sabana y en la selva.":[8,100.06,3.66],"Es el animal más grande de la tierra. Usa la trompa para beber, oler, coger cosas y saludar.":[8,104.02,6.24],"cebra":[8,110.56,0.698],"Cada cebra tiene sus rayas diferentes, como nuestras huellas de los dedos.":[8,111.558,4.0],"hipopótamo":[8,115.858,1.0],"Vive en África, en los ríos y lagos.":[8,117.158,2.38],"Pasa el día dentro del agua para no quemarse con el sol y sale de noche a comer hierba.":[8,119.838,4.4],"Es el animal más rápido de la tierra: corre casi tan rápido como un coche en la autovía.":[8,124.538,4.58],"dromedario":[8,129.418,0.9],"Vive en los desiertos de África, como el Sáhara.":[8,130.618,2.6],"Tiene una sola joroba. Su primo el camello tiene dos.":[8,133.518,3.14],"camello":[8,136.957,0.7],"Vive en los desiertos de Asia, como el desierto de Gobi, en Mongolia.":[8,137.957,3.7],"Tiene dos jorobas llenas de grasa y aguanta muchos días sin beber agua.":[8,141.957,3.74],"panda":[8,145.998,0.62],"Vive en Asia, en los bosques de bambú de las montañas de China.":[8,146.918,3.36],"Se pasa casi todo el día comiendo bambú.":[8,150.578,2.26],"Vive en Asia, en las selvas y bosques de la India y de otros países.":[8,153.138,3.76],"Es el felino más grande del mundo y, al contrario que los gatos, le encanta nadar.":[8,157.198,4.44],"orangután":[8,161.937,0.94],"Vive en Asia, en las selvas de las islas de Borneo y Sumatra.":[8,163.177,3.34],"Su nombre significa «persona del bosque». Pasa casi toda su vida en los árboles.":[8,166.817,4.54],"Vive en Oceanía, en Australia.":[8,171.657,2.02],"Avanza dando saltos enormes. Su cría crece dentro de una bolsa en la tripa de su madre.":[8,173.977,5.62],"koala":[8,179.897,0.7],"Vive en Oceanía, en los bosques de eucaliptos de Australia.":[8,180.897,3.2],"Come hojas de eucalipto y duerme casi todo el día, ¡unas veinte horas!":[8,184.397,3.8],"El pingüino emperador vive en la Antártida, en el Polo Sur.":[8,188.497,3.14],"No sabe volar, pero nada rapidísimo. El papá cuida el huevo entre sus patas.":[8,191.937,5.12],"oso polar":[8,197.357,0.86],"Vive en el Ártico, cerca del Polo Norte, por ejemplo en Canadá.":[8,198.517,3.48],"Su pelo parece blanco para esconderse en la nieve, pero su piel es negra.":[8,202.297,3.82],"bisonte":[8,206.417,0.84],"Vive en América del Norte, en las praderas de Estados Unidos y Canadá.":[8,207.557,3.68],"Es el animal más pesado de América del Norte.":[8,211.537,2.52],"mapache":[8,214.357,0.82],"Vive en América del Norte, en bosques cerca de ríos.":[8,215.477,4.158],"Parece que lleva un antifaz y moja la comida en el agua antes de comérsela.":[8,219.935,3.72],"Vive en América del Sur, en las montañas de los Andes, en Perú y Bolivia.":[8,223.955,4.26],"Si se enfada, ¡escupe! Su lana es muy calentita.":[8,228.515,3.54],"perezoso":[8,232.355,0.84],"Vive en América del Sur, en la selva del Amazonas, en Brasil.":[8,233.495,3.62],"Es tan lento que en su pelo crecen algas verdes.":[8,237.415,2.76],"guacamayo":[8,240.475,0.9],"Vive en América del Sur, en la selva del Amazonas.":[8,241.675,2.92],"Tiene plumas de muchos colores y un pico muy fuerte para romper semillas.":[8,244.895,4.0],"lince ibérico":[8,249.195,1.16],"Vive solo en España y Portugal. En Andalucía vive en Doñana y en Sierra Morena, muy cerca de Córdoba.":[8,250.655,6.2],"Estuvo a punto de desaparecer, pero gracias a los cuidados ya hay más de dos mil. Le encantan los conejos.":[8,257.155,6.34],"lobo ibérico":[8,263.795,1.12],"Vive en Europa, en los montes del norte de España, como en Zamora y Asturias.":[8,265.215,4.36],"Vive en manadas y aúlla para hablar con los demás lobos.":[8,269.875,2.88],"oso pardo":[8,273.055,0.9],"En España vive en las montañas del norte: en Asturias, Cantabria y León.":[8,274.255,4.14],"En invierno se mete en una cueva y duerme mucho: hiberna. Su cría se llama osezno.":[8,278.695,5.62],"cigüeña":[8,284.615,0.74],"En primavera y verano vive en España. En invierno, muchas viajan a África.":[8,285.655,4.68],"Hace nidos enormes en lo alto de las torres y los campanarios, y vuelve a ellos cada año.":[8,290.635,4.88],"flamenco":[8,295.815,0.8],"En España podemos verlo en Doñana y en la laguna de Fuente de Piedra, en Málaga.":[8,296.915,4.4],"Es rosa por los camarones que come, y le encanta dormir sobre una sola pata.":[8,301.615,4.3],"Vive en todos los océanos del mundo.":[8,306.215,2.04],"La ballena azul es el animal más grande que ha existido, ¡más que los dinosaurios!":[8,308.555,4.7],"Vive en los mares y océanos de casi todo el mundo.":[8,313.555,2.6],"Es muy listo, juega en grupo y respira aire por un agujero que tiene en la cabeza.":[8,316.455,4.58],"Vive en los mares y océanos.":[8,321.335,1.7],"Le salen dientes nuevos durante toda su vida.":[8,323.335,2.48],"Vive en ríos, lagos y mares.":[8,326.115,2.181],"Respira debajo del agua gracias a sus branquias.":[8,328.596,2.72],"foca":[8,331.616,0.66],"Vive en los mares fríos, cerca de los polos.":[8,332.576,2.56],"En el agua nada muy bien, pero en la tierra se mueve arrastrándose.":[8,335.436,3.48],"Vive en los ríos de las zonas calurosas, por ejemplo en el río Nilo, en África.":[8,339.216,4.4],"Puede quedarse muy quieto, como un tronco, esperando a su presa.":[8,343.916,3.64],"Hay tortugas de tierra, de río y de mar.":[8,347.856,2.48],"Las tortugas gigantes de las islas Galápagos pueden vivir más de cien años.":[8,350.636,4.32],"Vive en muchos sitios: desiertos, selvas y campos.":[8,355.256,3.38],"No tiene patas y saca la lengua para oler.":[8,358.936,2.42],"Vive en paredes y piedras donde da el sol.":[8,361.656,2.36],"Si la atrapan por la cola, la suelta, ¡y le vuelve a crecer!":[8,364.316,3.14],"Vive cerca de ríos, charcas y lagos.":[8,367.756,2.48],"De pequeña es un renacuajo con cola que vive en el agua.":[8,370.536,3.08],"Vive en ríos, lagos y estanques.":[8,373.916,2.12],"Tiene las patas palmeadas, como las aletas de un buzo, para nadar mejor.":[8,376.336,3.9],"castor":[8,380.536,0.7],"Vive en los ríos de América del Norte y de Europa.":[8,381.536,2.48],"Con sus dientes corta árboles y construye presas en los ríos.":[8,384.316,3.6],"búho":[8,388.216,0.68],"Vive en los bosques.":[8,389.196,1.28],"Caza de noche y puede girar la cabeza muchísimo.":[8,390.776,3.02],"Vive en los bosques. En España hay muchos en Sierra Morena.":[8,394.095,3.48],"A los machos les crecen cuernos nuevos cada año.":[8,397.875,2.88],"Vive en bosques y campos de casi todo el mundo.":[8,401.055,2.62],"Tiene una cola muy peluda que usa como manta para dormir.":[8,403.975,3.14],"Vive en los bosques, en lo alto de los árboles.":[8,407.415,2.6],"Esconde frutos secos para comérselos en invierno.":[8,410.315,2.78],"Vive en las montañas. En España vive el águila imperial ibérica.":[8,413.395,4.0],"Ve tan bien que descubre un conejo desde muy, muy alto.":[8,417.695,3.78],"cabra":[8,421.775,0.62],"La cabra montés vive en las montañas de España.":[8,422.695,2.62],"Trepa por las rocas más empinadas sin caerse.":[8,425.615,2.7],"Vive en las granjas y en los prados.":[8,428.615,1.9],"Nos da leche, y con la leche se hacen el queso y el yogur.":[8,430.815,3.26],"Vive en granjas, cuadras y prados.":[8,434.375,2.28],"Puede dormir de pie sin caerse.":[8,436.955,1.9],"oveja":[8,439.155,0.819],"Vive en las granjas y en el campo.":[8,440.275,1.76],"Con su lana se hacen jerséis y mantas.":[8,442.335,2.4],"Vive en las granjas.":[8,445.035,1.24],"Es muy listo y se revuelca en el barro para refrescarse.":[8,446.575,3.26],"Vive en los corrales de las granjas.":[8,450.135,1.9],"Pone los huevos que comemos.":[8,452.335,1.68],"Vive en granjas y en el campo.":[8,454.315,1.68],"Es muy fuerte y ayuda a llevar cargas pesadas.":[8,456.295,2.78],"Vive en el campo, en madrigueras bajo tierra.":[8,459.375,2.52],"Tiene las orejas muy largas para oír los peligros desde lejos.":[8,462.195,3.36],"Vive con las personas, en casa.":[8,465.855,2.02],"Tiene un olfato buenísimo y es el mejor amigo de las personas.":[8,468.175,3.56],"Ve muy bien de noche y ronronea cuando está contento.":[8,472.035,3.06],"Vive en cuevas y sale de noche.":[8,475.395,1.98],"Es el único mamífero que vuela de verdad.":[8,477.675,2.22],"Vive en jardines, campos y bosques, cerca de las flores.":[8,480.195,3.54],"Antes de ser mariposa es una oruga. function confetti(){

  const t0=performance.now(); let last=t0;

    ps.forEach(p=>{p.vy+=.35*dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.a+=p.va*dt;g.save();g.translate(p.x,p.y);g.rotate(p.a);g.fillStyle=p.c;

/* código de progreso: sirve para otro iPad y para pasar de Safari a la app de la pantalla de inicio,
   que en el iPad guardan sus datos por separado */
/* El código va sin palabras delante («MOCHILA:» parecía un enlace y el iPad lo cambiaba al pegarlo)
   y solo con letras, números, - y _. Al leerlo se busca el código dentro de lo que se haya pegado. */
const exportCode=()=>btoa(unescape(encodeURIComponent(JSON.stringify({v:1,players:DB.players})))).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');
function readCode(t){
  t=t.replace(/-/g,'+').replace(/_/g,'/').replace(/[^A-Za-z0-9+/]/g,''); while(t.length%4) t+='=';
  const d=JSON.parse(decodeURIComponent(escape(atob(t)))); if(!d||!Array.isArray(d.players)) throw new Error('código'); return d;
}
function findCode(txt){
  let s=String(txt||''); try{if(/%[0-9a-f]{2}/i.test(s)) s=decodeURIComponent(s);}catch(e){}
  const tries=[...(s.match(/[A-Za-z0-9+/_-]{16,}=*/g)||[]).sort((a,b)=>b.length-a.length),s.replace(/^[\s\S]*?mochila\s*:/i,'').replace(/\s+/g,'')];
  for(const t of tries){try{return readCode(t);}catch(e){}}
  throw new Error('código');
}
function importCode(txt){
  const d=findCode(txt);
  const arr=v=>Array.isArray(v)?v:[], norm=v=>String(v||'').trim().toLowerCase(); let n=0, last=null;
  d.players.forEach(p=>{if(!p||!p.id||!p.name) return;
    const cur=DB.players.find(x=>x.id===p.id)||DB.players.find(x=>norm(x.name)===norm(p.name));
    if(cur){cur.stars=cur.stars||{};Object.entries(p.stars||{}).forEach(([k,v])=>{if((cur.stars[k]||0)<v)cur.stars[k]=v;});
      cur.read=[...new Set([...arr(cur.read),...arr(p.read)])].slice(-90);cur.album=[...new Set([...arr(cur.album),...arr(p.album)])];
      cur.trophies=[...new Set([...arr(cur.trophies),...arr(p.trophies)])];last=cur;}
    else{last={id:String(p.id),name:String(p.name).slice(0,16),avatar:p.avatar||'🦊',stars:p.stars||{},read:arr(p.read),album:arr(p.album),trophies:arr(p.trophies)};DB.players.push(last);}
    n++;});
  if(!n) throw new Error('vacío');
  if(!DB.cur||!me()) DB.cur=last.id;
  migrate(); save(); for(const k in SHOWN) delete SHOWN[k]; return n;
}

function numAnswer(answer,ctx,{explain,hint,voice}={}){
  let val='',tries=0,clearNext=false;

  const max=Math.max(String(answer).length+1,3);
  const upd=()=>{disp.textContent=val||'?';disp.classList.toggle('empty',!val);};
  const kp=keypad(c=>{

    if(clearNext&&c!=='ok'){val='';clearNext=false;disp.classList.remove('bad');}
    if(c==='del') val=val.slice(0,-1);
    else if(c==='ok'){
      if(!val||clearNext) return;
      if(Number(val)===answer){disp.classList.add('good');ctx.right(typeof explain==='function'?explain():explain,voice);}
      else{tries++;disp.classList.remove('bad');void disp.offsetWidth;disp.classList.add('bad');clearNext=true;ctx.wrong(tries>=2?`Pista: es el ${answer}. Escríbelo.`:(typeof hint==='function'?hint(Number(val)):hint)||'');return;}

function numHard(lvl,i){

    stage.append(pane2([h('div',{class:'q-prompt'},'¿Qué número es?'),h('div',{class:'q-big'},parts.join(' + '))],[disp,kp]));instr(SAYM.decomp);}
  else if(q.type==='regroup'){const {disp,kp}=num(q.ans,`${q.c} centenas son ${q.c*100}; ${q.d} decenas son ${q.d*10}; y ${q.u} unidades. ${q.c*100} + ${q.d*10} + ${q.u} = ${q.ans}.`,'Diez decenas hacen una centena: pasa las que sobran a las centenas.');
    stage.append(pane2([h('div',{class:'q-prompt'},'¿Qué número es?'),h('div',{class:'q-big',style:'font-size:clamp(1.8rem,5vw,2.6rem)'},`${q.c} centenas, ${q.d} decenas y ${q.u} unidades`)],[disp,kp]));instr(SAYM.regroup);}

function colOp(a,b,op,ctx){
  const res=op==='+'?a+b:a-b, W=Math.max(String(a).length,String(b).length,String(res).length);
  const pad=n=>String(n).padStart(W,' ').split('');
  const A=pad(a),B=pad(b),R=pad(res);
  const grid=h('div',{class:'colop',style:`grid-template-columns:repeat(${W+1},auto)`});
  const resCells=[],carryCells=[];let sel=null;
  const select=c=>{if(sel)sel.classList.remove('sel');sel=c;c.classList.add('sel');};
  grid.append(h('div',{class:'carry-lbl'},'llevadas (si las necesitas)'),h('span'));
  for(let j=0;j<W;j++){if(j<W-1){const c=h('button',{class:'cell carry','aria-label':'Llevada de las '+PLACE[W-1-j],'data-col':j,onclick:()=>select(c)});carryCells.push(c);grid.append(c);}else grid.append(h('span'));}
  grid.append(h('span'));A.forEach(d=>grid.append(h('span',{class:'cell'},d.trim())));
  grid.append(h('span',{class:'cell sign'},op==='+'?'+':'−'));B.forEach(d=>grid.append(h('span',{class:'cell'},d.trim())));
  grid.append(h('div',{class:'opline'}),h('span'));
  for(let j=0;j<W;j++){const c=h('button',{class:'cell in','aria-label':'Resultado, '+PLACE[W-1-j],'data-col':j,onclick:()=>select(c)});resCells.push(c);grid.append(c);}
  select(resCells[W-1]);
  let done=false;
  function hintFor(j){
    const k=W-1-j, da=+(A[j].trim()||0), db=+(B[j].trim()||0);
    if(op==='+'){let carry=0;for(let t=W-1;t>j;t--){const s=+(A[t].trim()||0)+ +(B[t].trim()||0)+carry;carry=s>=10?1:0;}
      const s=da+db+carry;return `En las ${PLACE[k]}: ${da} + ${db}${carry?' + 1 que me llevaba':''} = ${s}. Escribo el ${s%10}${s>=10?' y me llevo 1':''}.`;}
    if(k===0) return da<db?`En las unidades: ${da} es menor que ${db}, así que hacemos ${da+10} − ${db} = ${da+10-db} y hay llevada.`:`En las unidades: ${da} − ${db} = ${da-db}.`;
    return `Revisa las ${PLACE[k]}. ¿Te has acordado de la llevada?`;
  }
  const kp=keypad(key=>{
    if(done) return;
    if(key==='ok'){
      if(resCells.every(c=>!c.textContent)) return;
      const bad=[];resCells.forEach((c,j)=>{const exp=R[j].trim(),got=c.textContent;const ok=exp===''?(got===''||got==='0'):got===exp;c.classList.toggle('bad',!ok);if(!ok)bad.push(j);});
      if(!bad.length){done=true;resCells.forEach(c=>{c.classList.remove('sel');c.classList.add('good');});carryCells.forEach(c=>c.classList.remove('sel'));ctx.right(`${a} ${op==='+'?'+':'−'} ${b} = ${res}`);}
      else ctx.wrong(hintFor(bad[bad.length-1]));
      return;
    }
    if(!sel) return;
    if(key==='del'){
      if(!sel.textContent&&resCells.includes(sel)){const j=resCells.indexOf(sel);if(j<W-1)select(resCells[j+1]);}
      sel.textContent='';sel.classList.remove('bad');return;
    }
    sel.textContent=key;sel.classList.remove('bad');
    if(carryCells.includes(sel)) select(resCells[+sel.dataset.col]);
    else{const j=resCells.indexOf(sel);if(j>0)select(resCells[j-1]);}
  });
  return {grid,kp};
}
function carries(a,b,op){let c=0,k=0;for(;a||b;a=Math.floor(a/10),b=Math.floor(b/10)){const x=a%10,y=b%10;if(op==='+'){const s=x+y+k;k=s>=10?1:0;c+=k;}else{const s=x-y-k;k=s<0?1:0;c+=k;}}return c;}
function genOp(op,lvl){
  if(lvl==='4') for(;;){if(op==='+'){const a=rnd(1205,7800),b=rnd(1105,9800-a);if(carries(a,b,'+')>=2)return [a,b];}else{const a=rnd(2005,9900),b=rnd(1105,a-150);if(carries(a,b,'-')>=2)return [a,b];}}
  for(;;){
    if(op==='+'){
      if(lvl==='2'){const a=rnd(15,89),b=rnd(12,89);if(a%10+b%10>=10)return [a,b];}
      else{const a=rnd(105,780),b=rnd(105,Math.min(880,999-a));if(b<100)continue;if(a%10+b%10>=10||Math.floor(a/10)%10+Math.floor(b/10)%10+((a%10+b%10)>=10?1:0)>=10)return [a,b];}
    }else{
      if(lvl==='2'){const a=rnd(30,98),b=rnd(11,a-5);if(a%10<b%10)return [a,b];}
      else{const a=rnd(210,999),b=rnd(105,a-20);if(a%10<b%10||Math.floor(a/10)%10<Math.floor(b/10)%10)return [a,b];}
    }
  }
}

function numLine(n,low,step){
  const X=v=>40+(v-low)/step*560, NS='http://www.w3.org/2000/svg';
  const s=document.createElementNS(NS,'svg');s.setAttribute('viewBox','0 0 640 140');s.setAttribute('class','numline');s.setAttribute('role','img');s.setAttribute('aria-label',`Recta del ${low} al ${low+step}`);
  const add=(tag,at,txt)=>{const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);if(txt!=null)e.textContent=txt;s.append(e);return e;};
  add('line',{x1:40,y1:90,x2:600,y2:90,class:'axis'});
  for(let k=0;k<=10;k++){const v=low+k*step/10,x=X(v);add('line',{x1:x,y1:k===5?72:78,x2:x,y2:k===5?108:102,class:'tick'+(k===5?' mid':'')});}
  [low,low+step].forEach(v=>add('text',{x:X(v),y:134,'text-anchor':'middle'},v));
  add('text',{x:X(low+step/2),y:134,'text-anchor':'middle',style:'font-size:17px;fill:var(--ink-soft)'},low+step/2);
  const x=X(n);add('path',{d:`M${x-13} 44 L${x+13} 44 L${x} 66 Z`,class:'mark'});add('text',{x,y:34,'text-anchor':'middle',class:'mark-t'},n);
  return s;
}

 {op:'×',expr:'7 × 10',r:70,o:'lápices',t:'Un paquete trae 10 lápices. Compro 7 paquetes. ¿Cuántos lápices tengo?',s:'Tengo 70 lápices.',v:'tengo'},

 {op:'×-',expr:'20 − 3 × 5',r:5,o:'euros',t:'Lola compra 3 entradas de cine de 5 euros cada una. Paga con un billete de 20 euros. ¿Cuánto dinero le devuelven?',s:'A Lola le devuelven 5 euros.',v:'devuelven'},

const OPL={'+':'＋ Sumar','-':'－ Restar','+-':'Sumar y luego restar','-+':'Restar y luego sumar','++':'Sumar dos veces','--':'Restar dos veces','×':'✖️ Multiplicar','×-':'Multiplicar y luego restar','×+':'Multiplicar y luego sumar'};
defGame({id:'problemas',subject:'mates',icon:'🧠',title:'Problemas',desc:'Nivel 1: una operación · Nivel 2: dos pasos · Nivel 3: con multiplicaciones',rounds:6,
  prepare(run){run.data.next=deck([PROBS,PROBS2,PROBS3][(run.lvl||1)-1]);},
  make(run){const p=run.data.next();return {...p,r:p.r!=null?p.r:(p.op==='+'?p.a+p.b:p.a-p.b)};},
  render(q,stage,ctx,run){

    const sym=q.op==='+'?'+':'−';
    const lvl=run.lvl||1, opList=lvl===1?['+','-']:shuffle([q.op,...pickN((lvl===2?['+-','-+','++','--']:['×','+','-','×-','×+']).filter(o=>o!==q.op),2)]);

        else{b.classList.add('ko');ctx.wrong(lvl===1?(q.op==='+'?'Se juntan o se añaden cosas: hay que sumar.':'Se quitan, se van o falta algo: hay que restar.'):lvl===2?'Lee el problema por partes: ¿qué pasa primero y qué pasa después?':'Si se repite la misma cantidad varias veces, hay que multiplicar.');}}},OPL[v]);return b;})));}
    function step2(){const {disp,kp}=numAnswer(q.r,{right:()=>{sfx.ok();hideFb();setTimeout(step3,500);},wrong:ctx.wrong},{hint:lvl===1?'Haz la cuenta en columna en tu cuaderno, empezando por las unidades.':'Hazlo por partes: primero una cuenta y luego la otra.'});
      area.replaceChildren(h('div',{class:'q-prompt'},`2. Calcula: ${q.expr||(q.a+' '+sym+' '+q.b)}`),h('div',{class:'split'},disp,kp));instr(SAYM.probCalc);}
    function step3(){
      area.replaceChildren(h('div',{class:'q-prompt'},'3. ¿Cómo escribo la solución?'),
        choices(shuffle([q.s,`${q.r} ${q.o}`,`${q.r}`]),q.s,ctx,{wide:true,explain:`La solución es una frase completa con el verbo: «${q.v}».`,voice:{pre:q.s,post:SAYM.probRule},hint:'En la solución hay que poner una frase con verbo, no solo el número.'}));
      instr(SAYM.probSol);}
    stage.append(pane2([h('article',{class:'readtext'},h('p',null,q.t)),sayBtn(q.t)],[area],'text'));
    step1(); instr(q.t,lvl===1?SAYM.probOp:lvl===2?SAYM.probOps:SAYM.probOp1);
  }});
</script>
<script>

const COL={rojo:'#E8343F',amarillo:'#FFCF1F',azul:'#2F6FE4',naranja:'#FF8A1F',verde:'#2DAA4F',morado:'#8D3FD1',blanco:'#FFFFFF',negro:'#2B2F3A',rosa:'#FF9CC2',gris:'#9AA3B2',celeste:'#86D0FF',marron:'#8A5530'};

const MIXES=[['rojo','amarillo','naranja'],['amarillo','azul','verde'],['rojo','azul','morado'],['rojo','blanco','rosa'],['negro','blanco','gris'],['azul','blanco','celeste']];

defGame({id:'colores',subject:'arte',icon:'🎨',title:'Mezcla colores',desc:'Colores primarios y qué sale al mezclarlos. Nivel 3: solo con palabras',rounds:8,

        onPick:ok=>{if(ok) fill(res,q.r);}});
    }else if(q.t==='pair'){
      const l=bl(null,'q'),r=bl(null,'q');
      mixRow=h('div',{class:'mix'+(W?' words':'')},l,h('b',null,'+'),r,h('b',null,'='),bl(q.r));

      opts=choices(pairs.map(([a,b])=>({value:a+'+'+b,label:W?`${cap(CN[a])} y ${CN[b]}`:[h('span',{class:'pair'},blob(a,'mini'),'+',blob(b,'mini')),h('span',null,`${cap(CN[a])} y ${CN[b]}`)]})),q.a+'+'+q.b,ctx,
        {cls:'colors pairs'+(W?' words':''),explain:q.why,voice:{post:q.why},hint:'Piensa qué dos colores llevan dentro ese color.',

    stage.append(box); instr(q.say);

/* ---- formas ---- */
const SH={circulo:{n:'círculo',l:0},cuadrado:{n:'cuadrado',l:4},triangulo:{n:'triángulo',l:3},rectangulo:{n:'rectángulo',l:4},ovalo:{n:'óvalo',l:0},rombo:{n:'rombo',l:4},pentagono:{n:'pentágono',l:5},hexagono:{n:'hexágono',l:6}};
const BASIC=['circulo','cuadrado','triangulo','rectangulo','ovalo','rombo'];
const SHOBJ=[['🕐','el reloj','circulo'],['🍪','la galleta','circulo'],['🚪','la puerta','rectangulo'],['📺','la tele','rectangulo'],['🥚','el huevo','ovalo'],['🏈','el balón de rugby','ovalo'],
  ['🍕','el trozo de pizza','triangulo'],['⚠️','la señal de peligro','triangulo'],['🪁','la cometa','rombo'],['🧇','el gofre','cuadrado']];
const sidesWhy=id=>SH[id].l?`El ${SH[id].n} tiene ${SH[id].l} lados.`:`El ${SH[id].n} no tiene lados: su borde es una línea curva.`;
const SHQ=[
  ...[...BASIC,'pentagono','hexagono'].map(id=>({t:'name',id,say:SAYA.forma,why:`Es un ${SH[id].n}.`})),
  ...['triangulo','cuadrado','rectangulo','rombo','pentagono','hexagono','circulo'].map(id=>({t:'sides',id,say:`¿Cuántos lados tiene el ${SH[id].n}?`,why:sidesWhy(id)})),
  ...SHOBJ.map(([e,o,id])=>({t:'obj',e,o,id,say:`¿Qué forma tiene ${o}?`,why:`${cap(o)} tiene forma de ${SH[id].n}.`})),
];
const VERTQ=['triangulo','cuadrado','rectangulo','rombo','pentagono','hexagono','circulo'].map(id=>({t:'vert',id,say:`¿Cuántos vértices tiene el ${SH[id].n}?`,
  why:SH[id].l?`El ${SH[id].n} tiene ${SH[id].l} vértices: los vértices son sus esquinas.`:`El ${SH[id].n} no tiene vértices: no tiene esquinas.`}));
const SHCOL=['rojo','azul','verde','naranja','morado','amarillo','celeste','rosa'];
let shapeN=0;
function shapeSvg(id,c,rot=0){
  const NS='http://www.w3.org/2000/svg',mk=(t,a)=>{const e=document.createElementNS(NS,t);for(const k in a)e.setAttribute(k,a[k]);return e;};
  const svg=mk('svg',{viewBox:'0 0 200 200',class:'shape',role:'img','aria-label':'Una forma'}),gid='sg'+(++shapeN);
  const gr=mk('linearGradient',{id:gid,x1:0,y1:0,x2:0,y2:1});gr.append(mk('stop',{offset:'0','stop-color':'#fff','stop-opacity':'.45'}),mk('stop',{offset:'.55','stop-color':'#fff','stop-opacity':'0'}));
  const defs=mk('defs',{});defs.append(gr);svg.append(defs);
  const poly=(n,r,rot,dy=0)=>Array.from({length:n},(_,i)=>{const a=(rot+i*360/n)*Math.PI/180;return `${(100+r*Math.cos(a)).toFixed(1)},${(100+dy+r*Math.sin(a)).toFixed(1)}`;}).join(' ');
  const shape=()=>{switch(id){
    case 'circulo':return mk('circle',{cx:100,cy:100,r:82});
    case 'ovalo':return mk('ellipse',{cx:100,cy:100,rx:90,ry:60});
    case 'cuadrado':return mk('rect',{x:28,y:28,width:144,height:144,rx:8});
    case 'rectangulo':return mk('rect',{x:8,y:50,width:184,height:100,rx:8});
    case 'triangulo':return mk('polygon',{points:poly(3,94,-90,14)});
    case 'rombo':return mk('polygon',{points:'100,10 160,100 100,190 40,100'});
    case 'pentagono':return mk('polygon',{points:poly(5,90,-90,6)});
    default:return mk('polygon',{points:poly(6,90,0)});}};
  const base=shape(),shine=shape();
  base.setAttribute('fill',COL[c]);base.setAttribute('stroke','rgba(0,0,0,.22)');base.setAttribute('stroke-width','8');base.setAttribute('stroke-linejoin','round');
  shine.setAttribute('fill',`url(#${gid})`);
  svg.append(base,shine); if(rot&&id!=='circulo'){svg.style.transform=`rotate(${rot}deg)`;} return svg;
}
defGame({id:'formas',subject:'arte',icon:'🔺',title:'Formas',desc:'Círculo, cuadrado, triángulo, rectángulo, óvalo y rombo',rounds:8,

      explain:`${q.is} ${FAM[q.f].why}`,voice:{post:[q.is,FAM[q.f].why]},hint:'¿Cómo se toca: con cuerdas, soplando o golpeando?'});

    clearTimeout(instrTimer); instrTimer=setTimeout(()=>{if(DB.sound) speak(q.ask,'es-ES',.9,()=>playIns(q));},350);

/* ---- cualidades del sonido (sintetizadas) ---- */

const SONQ=['agudo','grave','largo','corto','fuerte','fuerte'];
const clipDur=k=>{const x=V.map[k];return x?x[2]*1000:1500;};
defGame({id:'sonido',subject:'arte',icon:'🔉',title:'Agudo, grave, largo, corto…',desc:'Altura, duración e intensidad. En los niveles 2 y 3 se comparan dos sonidos cada vez más parecidos',rounds:8,
  prepare(run){run.data.next=deck((run.lvl||1)===1?SONQ:['cagudo','clargo','cfuerte','cagudo','clargo','cfuerte']);},
  make(run){const k=run.data.next(),lvl=run.lvl||1;

/* ---- repite la melodía ---- */
const KEYS=[{n:'Do',k:'do',c:'rojo'},{n:'Re',k:'re',c:'naranja'},{n:'Mi',k:'mi',c:'amarillo'},{n:'Sol',k:'sol',c:'verde'},{n:'La',k:'la',c:'azul'}];
const SIMON_LV=7, simonStars=l=>l>=7?3:l>=5?2:l>=3?1:0;
const SIMON_CFG={1:{keys:[0,2,3,4],start:2,gap:560},2:{keys:[0,2,3,4],start:3,gap:460},3:{keys:[0,1,2,3,4],start:3,gap:400}};
defGame({id:'simon',subject:'arte',icon:'🎹',title:'Repite la melodía',desc:'Escucha las notas y tócalas en el mismo orden. Nivel 3: con cinco teclas',marks:[3/7,5/7,1],
  custom(stage,run,ctx){
    const cfg=SIMON_CFG[run.lvl||1],K=cfg.keys.map(i=>KEYS[i]),N=K.length;
    let seq=Array.from({length:cfg.start},()=>rnd(0,N-1)),pos=0,lock=true,fails=0,done=0,timers=[];
    const later=(fn,ms)=>timers.push(setTimeout(fn,ms));
    const info=h('div',{class:'tag'},'Escucha…');
    const keys=K.map((k,i)=>h('button',{class:'skey',style:`--k:${COL[k.c]}`,'aria-label':'Nota '+k.n,onpointerdown:e=>{e.preventDefault();tap(i);},onclick:e=>{if(e.detail===0)tap(i);}},h('span',null,k.n)));
    const again=h('button',{class:'btn ghost',onclick:()=>{if(!lock){sfx.tap();playSeq();}}},'🔁 Oír otra vez');
    function light(i,ms=320){const b=keys[i];b.classList.add('on');playSnd('♪n-'+K[i].k);later(()=>b.classList.remove('on'),ms);}
    function playSeq(){lock=true;pos=0;info.textContent='Escucha…';info.className='tag';
      seq.forEach((n,k)=>later(()=>light(n,Math.min(320,cfg.gap-120)),400+k*cfg.gap));
      later(()=>{lock=false;info.textContent='¡Ahora tú!';info.className='tag go';if(DB.sound&&done===0&&fails===0) speak(SAYA.tu);},400+seq.length*cfg.gap);}
    function tap(i){
      if(lock) return; light(i,220);
      if(i!==seq[pos]){lock=true;fails++;sfx.ko();
        if(fails>=2){later(()=>end(),700);return;}
        showToast('¡Uy! Esa no era',SAYA.otra); if(DB.sound) later(()=>speak(SAYA.otra),300); later(playSeq,1500); return;}
      pos++;
      if(pos===seq.length){lock=true;done++;fails=0;ctx.meter(done/SIMON_LV,simonStars(done));
        if(done>=SIMON_LV){later(()=>end(),900);return;}
        info.textContent='¡Muy bien!';info.className='tag good'; if(DB.sound) later(()=>speak(SAYA.mas),350);
        seq.push(rnd(0,N-1)); later(playSeq,1900);}
    }
    function end(){timers.forEach(clearTimeout);timers=[];const st=Math.max(1,simonStars(done));
      ctx.finish(st,done?`Has repetido melodías de hasta ${seq.length-(done>=SIMON_LV?0:1)} notas.`:'¡Sigue practicando: escucha bien y repite!');}
    cleanup=()=>{timers.forEach(clearTimeout);timers=[];};
    stage.append(h('div',{class:'with-say'},h('div',{class:'q-prompt'},SAYA.simon),sayBtn(SAYA.simon)),info,h('div',{class:'simon'+(N===5?' five':'')},keys),again);
    if(DB.sound) speak(SAYA.simon,'es-ES',.9,()=>{if(RUN===run) playSeq();}); else later(playSeq,500);
  }});

function albumOf(p=me()){return (p&&p.album)||[];}
function unlockAnimal(n){const p=me(); if(!p||!ZN[n]) return false; p.album=p.album||[]; if(p.album.includes(n)) return false; p.album.push(n); save(); return true;}

defGame({id:'mapa',subject:'cono',icon:'🗺️',title:'¿Dónde vive?',desc:'Busca en el mapa del mundo el continente de cada animal',rounds:8,
  prepare(run){run.data.next=deck(ZOO.filter(a=>a.cont));},
  make(run){return run.data.next();},
  render(q,stage,ctx,run){
    if(lv(run)===3){
      const ask=`¿Qué animal vive en ${q.cont==='antartida'?'la ':''}${CONT[q.cont].l}?`;
      const map=h('div',{class:'map small'},h('img',{src:'img/mapa.jpg',alt:'Mapa del mundo'}),Object.entries(CONT).map(([k,c])=>h('span',{class:'cont'+(k===q.cont?' sel':' dim'),style:`left:${c.x}%;top:${c.y}%`},c.l)));
      stage.append(h('div',{class:'with-say'},h('div',{class:'q-prompt'},ask),sayBtn(ask)),map,
        aniPick(q,pickN(ZOO.filter(a=>a.cont&&a.cont!==q.cont),3),ctx,{explain:q.where,voice:{post:q.where},hint:v=>`${cap(v)} no vive en ${CONT[q.cont].l}.`}));
      sayC(ask); return;}
    let done=false;
    const map=h('div',{class:'map'},h('img',{src:'img/mapa.jpg',alt:'Mapa del mundo'}),
      Object.entries(CONT).map(([k,c])=>{const b=h('button',{class:'cont',style:`left:${c.x}%;top:${c.y}%`,onclick:()=>{
        if(done||b.classList.contains('ko')) return;

        else{b.classList.add('ko');ctx.wrong(`No vive en ${c.l}.`+(lv(run)===1&&q.hab?` Pista: vive en ${HAB[q.hab].l.toLowerCase()}.`:''));}
      }},c.l);return b;}));

    sayC(q.n,SAYC.mapa);
  }});

function fichaSheet(a){
  const close=()=>{stopVoice();sheet.remove();};
  const row=(ic,t)=>t?h('li',null,h('span',{class:'ic','aria-hidden':'true'},ic),h('span',null,t)):null;
  const tipo=a.v?`Vertebrado${a.g?': '+GROUP[a.g].l.toLowerCase():''}`:'Invertebrado: no tiene huesos';
  const say=()=>{sb.classList.add('on');speakSeq([a.n,a.where,a.fact],'es-ES',()=>sb.classList.remove('on'));};
  const sb=h('button',{class:'btn',onclick:say},'🔊 Escuchar');
  const sheet=h('div',{class:'sheet',onclick:e=>{if(e.target===sheet)close();}},
    h('div',{class:'ficha',role:'dialog','aria-label':'Ficha de '+a.n},
      aniIcon(a,'big'),h('h2',null,cap(a.n)),
      h('ul',null,row('🌍',a.where),row('🍽️',a.diet&&DIET[a.diet].s),row(a.birth==='o'?'🥚':'🍼',a.birth&&BIRTH[a.birth].f),row('🦴',tipo),row('⭐',a.fact)),
      h('div',{class:'row center'},sb,h('button',{class:'btn ghost',onclick:close},'Cerrar'))));
  document.body.append(sheet); cleanup=close; if(DB.sound) say();
}

      doneBox.firstChild.classList.add('big');
      week.replaceWith(week=weekStrip());
      if(earnTrophy('lectura')){setTimeout(()=>{if(CUR_SUB==='lectura'&&!RW) showReward('lectura',true);},1600);return;}
      if(DB.sound) speak(SAYR.done);}
    cleanup=()=>{clearInterval(timer);relWake();};
    let week=weekStrip();
    stage.append(h('div',{class:'q-prompt'},'Lee en voz alta, despacito y respetando los puntos y las comas'),
      h('div',{class:'read-layout'},
        h('div',{class:'read-side'},chips,h('div',{class:'read-wrap'},mochi('read'),h('div',{class:'timer'},svg,time)),h('div',{class:'row center'},startB,resetB)),
        h('div',{class:'read-side'},doneBox,h('div',{class:'askcard'},h('h3',null,'Después de leer, pide a alguien de casa que te pregunte:'),h('ul',null,ASK.map(a=>h('li',null,a)))),
          h('strong',null,'Mi semana de lectura'),week)));
    draw(); instr(SAYR.start);
  }});

document.addEventListener('pointerup',()=>{try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist().catch(()=>{});}catch(e){}},{once:true});
if(me()) goHome(); else goProfiles();
if(location.hash==='#diag') diagPanel();
</script>
