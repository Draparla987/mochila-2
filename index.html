<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#BDE8FF">
<meta name="description" content="Juegos para repasar en casa lo de 2º de Primaria con Mochi: ortografía, comprensión, números, cuentas, tablas, animales, inglés y lectura.">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="img/icon-192.png">
<link rel="apple-touch-icon" href="img/icon-180.png">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}</style>
<title>Mochila de 2º</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Mochila 2º">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Andika:wght@400;700&family=Baloo+2:wght@600;700;800&display=swap">
<style>
/* Layout: mundo de plastilina — cielo de fondo, Mochi (la mascota) guía cada pantalla, fichas gorditas con relieve como juguetes */
:root{
  --sky1:#BDE8FF; --sky2:#F1FAFF; --cloud:rgba(255,255,255,.75);
  --ink:#232A4D; --ink-soft:#5C6589; --card:#FFFFFF; --line:#DDE6F4; --paper:#F7FAFF; --rule:#D8E6F6;
  --lengua:#F04F59; --mates:#3570F0; --cono:#1FA862; --ingles:#8456F0; --lectura:#F07A12; --cuaderno:#0AA3B2;
  --sun:#FFC93C; --on-c:#FFFFFF;
  --ok:#1FA65A; --ok-bg:#E3F7EA; --ko:#EC4256; --ko-bg:#FFE9EC; --star:#FFB400; --star-off:#D7E0EE;
  --shadow:rgba(35,42,77,.16);
  --f-display:"Baloo 2","Arial Rounded MT Bold",ui-rounded,system-ui,sans-serif;
  --f-read:"Andika","Trebuchet MS",system-ui,sans-serif;
  --r:28px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --sky1:#101A36; --sky2:#1B2852; --cloud:rgba(255,255,255,.05);
  --ink:#F2F5FF; --ink-soft:#AAB4D8; --card:#1F2B52; --line:#33416E; --paper:#18234A; --rule:#2B3966;
  --ok:#3ED184; --ok-bg:#163C2E; --ko:#FF7385; --ko-bg:#4A2235; --star:#FFC933; --star-off:#3A4775;
  --shadow:rgba(0,0,0,.4); color-scheme:dark }}
:root[data-theme="dark"]{
  --sky1:#101A36; --sky2:#1B2852; --cloud:rgba(255,255,255,.05);
  --ink:#F2F5FF; --ink-soft:#AAB4D8; --card:#1F2B52; --line:#33416E; --paper:#18234A; --rule:#2B3966;
  --ok:#3ED184; --ok-bg:#163C2E; --ko:#FF7385; --ko-bg:#4A2235; --star:#FFC933; --star-off:#3A4775;
  --shadow:rgba(0,0,0,.4); color-scheme:dark }

*{box-sizing:border-box}
html,body{min-height:100%}
body{margin:0; color:var(--ink); font-family:var(--f-read); font-size:18px; line-height:1.45;
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 70%) fixed; background-color:var(--sky2);
  -webkit-tap-highlight-color:transparent; -webkit-user-select:none; user-select:none; overflow-x:hidden}
body::before{content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(60px 34px at 12% 14%,var(--cloud) 98%,transparent),radial-gradient(44px 30px at 16% 11%,var(--cloud) 98%,transparent),
    radial-gradient(80px 40px at 84% 22%,var(--cloud) 98%,transparent),radial-gradient(52px 34px at 89% 18%,var(--cloud) 98%,transparent),
    radial-gradient(70px 36px at 60% 8%,var(--cloud) 98%,transparent),
    radial-gradient(900px 260px at 50% 112%,color-mix(in srgb,var(--cono) 22%,transparent) 60%,transparent 61%)}
input{-webkit-user-select:text; user-select:text}
button{font:inherit; color:inherit; cursor:pointer; touch-action:manipulation}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:4px solid var(--mates); outline-offset:3px}
img{display:block; max-width:100%}
#app{max-width:1040px; margin:0 auto; padding-inline:16px; padding-block:10px 160px}
h1,h2,h3{font-family:var(--f-display); line-height:1.08; margin:0; text-wrap:balance; font-weight:800}

/* barra superior */
.topbar{display:flex; align-items:center; gap:10px; padding-block:4px 10px}
.brand{display:flex; align-items:center; gap:8px; margin-right:auto; background:none; border:0; padding:0; font-family:var(--f-display); font-weight:800; font-size:1.5rem}
.brand img{width:48px; height:48px; object-fit:contain; filter:drop-shadow(0 3px 2px var(--shadow))}
.pill{display:flex; align-items:center; gap:8px; min-height:52px; background:var(--card); border:0; border-radius:999px; padding:4px 16px 4px 4px; font-weight:700; box-shadow:0 4px 0 var(--line),0 8px 18px var(--shadow)}
.pill .av{font-size:1.5rem; width:44px; height:44px; display:grid; place-items:center; border-radius:50%; background:color-mix(in srgb,var(--sun) 40%,var(--card))}
.coin{display:inline-flex; align-items:center; gap:4px; font-family:var(--f-display); font-weight:800; font-size:1.15rem; font-variant-numeric:tabular-nums}
.coin::before{content:"★"; display:grid; place-items:center; width:28px; height:28px; border-radius:50%; background:var(--star); color:#fff; font-size:1rem; box-shadow:inset 0 -3px 0 rgba(0,0,0,.15)}
.round{width:52px; height:52px; flex:none; border-radius:50%; border:0; background:var(--card); font-size:1.4rem; display:grid; place-items:center; box-shadow:0 4px 0 var(--line),0 8px 18px var(--shadow)}
.round:active,.pill:active{transform:translateY(3px); box-shadow:0 1px 0 var(--line)}

/* botones de juguete */
.btn{--c:var(--mates); display:inline-flex; align-items:center; justify-content:center; gap:10px; min-height:64px; padding:10px 30px; border:0; border-radius:22px;
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 78%,#fff),var(--c)); color:var(--on-c); font-family:var(--f-display); font-weight:800; font-size:1.4rem;
  text-shadow:0 2px 0 rgba(0,0,0,.15); box-shadow:inset 0 -6px 0 color-mix(in srgb,var(--c) 70%,#000),inset 0 3px 0 rgba(255,255,255,.35),0 8px 18px color-mix(in srgb,var(--c) 35%,transparent); transition:transform .08s}
.btn:active{transform:translateY(3px) scale(.98)}
.btn.ghost{background:var(--card); color:var(--ink); text-shadow:none; box-shadow:inset 0 -5px 0 var(--line),0 6px 14px var(--shadow)}
.btn.big{min-height:76px; font-size:1.65rem; padding-inline:40px}
.btn[disabled]{opacity:.45; pointer-events:none}
.row{display:flex; flex-wrap:wrap; gap:14px; align-items:center}
.center{justify-content:center; text-align:center}

/* Mochi y bocadillos */
.mochi{object-fit:contain; filter:drop-shadow(0 10px 10px var(--shadow)); animation:float 3.2s ease-in-out infinite}
.bubble{position:relative; background:var(--card); border-radius:26px; padding:16px 22px; box-shadow:0 6px 0 var(--line),0 12px 26px var(--shadow); min-width:0}
.bubble::before{content:""; position:absolute; left:-14px; top:38px; border:14px solid transparent; border-right-color:var(--card); border-left:0}
.bubble h1{font-size:clamp(1.9rem,4.6vw,2.7rem)}
.bubble p{margin:4px 0 0; color:var(--ink-soft); font-size:1.15rem}
.say{width:52px; height:52px; flex:none; border-radius:50%; border:0; background:color-mix(in srgb,var(--c,var(--mates)) 14%,var(--card)); color:var(--c,var(--mates)); font-size:1.4rem; display:grid; place-items:center; box-shadow:inset 0 -4px 0 color-mix(in srgb,var(--c,var(--mates)) 25%,var(--line))}
.say:active{transform:scale(.94)}
.say.on{animation:pulse 1s infinite}

/* inicio */
.hero{display:grid; grid-template-columns:auto 1fr; align-items:center; gap:10px 18px; margin-block:4px 22px}
.hero .mochi{width:clamp(130px,22vw,190px)}
.hero .bubble{display:flex; flex-wrap:wrap; align-items:center; gap:10px 16px}
.hero .bubble > div{flex:1; min-width:200px}
.subjects{display:grid; grid-template-columns:repeat(auto-fill,minmax(290px,1fr)); gap:26px 20px; padding-top:14px}
.subj{--c:var(--mates); position:relative; text-align:left; border:0; border-radius:var(--r); padding:22px 22px 20px; min-height:190px; color:var(--on-c);
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 72%,#fff) 0%,var(--c) 62%);
  box-shadow:inset 0 -9px 0 color-mix(in srgb,var(--c) 68%,#000),inset 0 4px 0 rgba(255,255,255,.35),0 14px 26px color-mix(in srgb,var(--c) 35%,transparent);
  display:flex; flex-direction:column; gap:6px; transition:transform .12s}
.subj:active{transform:scale(.97) translateY(3px)}
.subj-img{position:absolute; right:-8px; top:-30px; width:150px; height:150px; object-fit:contain; filter:drop-shadow(0 8px 6px rgba(0,0,0,.18)); transition:transform .25s}
.subj:hover .subj-img{transform:rotate(-6deg) scale(1.05)}
.subj-name{font-family:var(--f-display); font-weight:800; font-size:2.1rem; line-height:1; text-shadow:0 3px 0 rgba(0,0,0,.14); padding-right:120px}
.subj-blurb{font-size:1rem; line-height:1.3; padding-right:110px; opacity:.96; flex:1}
.subj-prog{display:flex; align-items:center; gap:10px; font-family:var(--f-display); font-weight:800; font-size:1.05rem}
.bar{flex:1; height:14px; border-radius:8px; background:rgba(0,0,0,.18); overflow:hidden; box-shadow:inset 0 2px 0 rgba(0,0,0,.12)}
.bar i{display:block; height:100%; min-width:14px; background:linear-gradient(180deg,#FFE27A,var(--star)); border-radius:8px}
.families{margin-top:30px; background:var(--card); border-radius:var(--r); padding:4px 22px; box-shadow:0 5px 0 var(--line),0 10px 22px var(--shadow)}
.families summary{font-family:var(--f-display); font-weight:800; font-size:1.25rem; padding-block:14px; cursor:pointer}
.families ul{margin:0 0 14px; padding-left:20px; max-width:72ch}
.families li{margin-bottom:6px}
.families p{max-width:72ch; color:var(--ink-soft)}

/* asignatura */
.banner{--c:var(--mates); position:relative; display:flex; align-items:center; gap:16px; min-height:150px; padding:20px 170px 20px 20px; margin:6px 0 24px; border-radius:var(--r); color:var(--on-c);
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 72%,#fff),var(--c) 65%); box-shadow:inset 0 -9px 0 color-mix(in srgb,var(--c) 68%,#000),0 14px 26px color-mix(in srgb,var(--c) 30%,transparent)}
.banner h1{font-size:clamp(2.2rem,6vw,3.2rem); text-shadow:0 3px 0 rgba(0,0,0,.15)}
.banner p{margin:2px 0 0; font-size:1.1rem; opacity:.95}
.banner img{position:absolute; right:6px; bottom:-6px; width:180px; height:180px; object-fit:contain; filter:drop-shadow(0 8px 8px rgba(0,0,0,.2))}
.banner .round{background:rgba(255,255,255,.92); color:var(--ink); box-shadow:0 4px 0 rgba(0,0,0,.15)}
.acts{display:grid; grid-template-columns:repeat(auto-fill,minmax(300px,1fr)); gap:16px}
.act{display:grid; grid-template-columns:76px 1fr; gap:4px 16px; align-items:center; text-align:left; background:var(--card); border:0; border-radius:24px; padding:16px 18px;
  box-shadow:inset 0 -6px 0 var(--line),0 10px 22px var(--shadow); transition:transform .1s}
.act:active{transform:translateY(3px) scale(.99)}
.act-icon{grid-row:1/4; width:76px; height:76px; border-radius:24px; display:grid; place-items:center; font-size:2.4rem;
  background:linear-gradient(160deg,color-mix(in srgb,var(--c) 30%,var(--card)),color-mix(in srgb,var(--c) 55%,var(--card))); box-shadow:inset 0 -5px 0 color-mix(in srgb,var(--c) 45%,var(--line))}
.act h3{font-size:1.4rem}
.act p{margin:0; color:var(--ink-soft); font-size:.95rem; line-height:1.3}
.stars{display:inline-flex; gap:3px; font-size:1.3rem; line-height:1}
.stars .on{color:var(--star); text-shadow:0 2px 0 color-mix(in srgb,var(--star) 60%,#000)} .stars .off{color:var(--star-off)}

/* juego */
.game{--c:var(--mates)}
.game-head{display:flex; align-items:center; gap:14px; margin-bottom:16px}
.game-title{flex:1; min-width:0}
.game-title h2{font-size:1.55rem; color:var(--c)}
.prog{display:flex; gap:5px; margin-top:6px; align-items:center}
.seg{flex:1; max-width:46px; height:14px; border-radius:8px; background:var(--card); box-shadow:inset 0 2px 0 var(--line)}
.seg.cur{background:color-mix(in srgb,var(--c) 40%,var(--card)); box-shadow:0 0 0 3px color-mix(in srgb,var(--c) 30%,transparent)}
.seg.ok{background:var(--ok)} .seg.miss{background:var(--star)}
.prog .goal{font-size:1.3rem; color:var(--star); margin-left:4px}
.stage{position:relative; background:var(--card); border-radius:34px; padding:clamp(18px,3.4vw,36px); min-height:380px; display:flex; flex-direction:column; align-items:center; gap:22px;
  box-shadow:inset 0 -8px 0 color-mix(in srgb,var(--c) 22%,var(--line)),0 18px 40px var(--shadow)}
.stage::before{content:""; position:absolute; inset:0 0 auto; height:10px; border-radius:34px 34px 0 0; background:var(--c); opacity:.9}
.q-prompt{font-family:var(--f-display); font-weight:800; font-size:clamp(1.45rem,3.4vw,2rem); text-align:center; line-height:1.15; max-width:30ch}
.q-note{color:var(--ink-soft); text-align:center; margin:-12px 0 0; max-width:52ch}
.q-emoji{font-size:clamp(5rem,13vw,7rem); line-height:1; filter:drop-shadow(0 8px 6px var(--shadow)); animation:popin .45s cubic-bezier(.3,1.6,.5,1) both}
.q-big{font-family:var(--f-display); font-weight:800; font-size:clamp(3rem,10vw,4.6rem); line-height:1; font-variant-numeric:tabular-nums; color:var(--ink)}
.with-say{display:flex; align-items:center; gap:14px; justify-content:center; flex-wrap:wrap}
.tag{display:inline-block; font-family:var(--f-display); font-weight:800; font-size:1rem; padding:4px 14px; border-radius:999px; background:color-mix(in srgb,var(--c) 16%,var(--card)); color:var(--ink)}
.tag.think{background:color-mix(in srgb,var(--star) 30%,var(--card))}

.opts{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:16px; width:100%; max-width:660px}
.opts.wide{grid-template-columns:1fr; max-width:580px}
.opt{position:relative; min-height:82px; border-radius:22px; border:3px solid color-mix(in srgb,var(--c) 30%,var(--line)); background:var(--card); font-family:var(--f-read); font-weight:700;
  font-size:clamp(1.5rem,3.8vw,2.1rem); padding:8px 14px; box-shadow:inset 0 -6px 0 color-mix(in srgb,var(--c) 18%,var(--line)); transition:transform .08s}
.opts.wide .opt{font-size:1.3rem; text-align:left; padding:14px 20px}
.opt:active{transform:translateY(3px) scale(.98)}
.opt.ok{background:var(--ok-bg); border-color:var(--ok); box-shadow:inset 0 -6px 0 color-mix(in srgb,var(--ok) 50%,var(--card)); animation:bounce .5s}
.opt.ko{background:var(--ko-bg); border-color:var(--ko); box-shadow:none; opacity:.55; pointer-events:none; text-decoration:line-through; animation:shake .35s}
.opt.lock{pointer-events:none}
.burst{position:absolute; left:50%; top:50%; pointer-events:none; color:var(--star); font-size:22px; animation:burst .7s ease-out forwards}

.word{display:flex; align-items:flex-end; flex-wrap:wrap; justify-content:center; font-size:clamp(2.8rem,8vw,4.2rem); font-weight:700; letter-spacing:.04em; line-height:1.1}
.gap{display:inline-block; min-width:1.2em; padding:0 .12em; margin:0 .06em; border-bottom:6px dashed var(--c); color:var(--c); text-align:center}
.gap.fill{border-bottom-style:solid; border-color:var(--ok); color:var(--ok); animation:bounce .5s}
.gap.empty::before{content:"?"; opacity:.35}

.ans{min-width:3.4em; padding:4px 18px; border-radius:20px; border:4px dashed var(--c); background:var(--paper); font-size:clamp(2.6rem,7vw,3.5rem); font-weight:700; text-align:center; font-variant-numeric:tabular-nums; line-height:1.2}
.ans.empty{color:var(--ink-soft); opacity:.55}
.ans.good{border-style:solid; border-color:var(--ok); color:var(--ok); background:var(--ok-bg); animation:bounce .5s}
.ans.bad{border-color:var(--ko); color:var(--ko); animation:shake .35s}
.keypad{display:grid; grid-template-columns:repeat(3,1fr); gap:10px; width:100%; max-width:350px}
.key{min-height:66px; border-radius:20px; border:0; background:var(--paper); font-family:var(--f-display); font-size:2rem; font-weight:800; font-variant-numeric:tabular-nums;
  box-shadow:inset 0 -6px 0 var(--line),0 4px 10px var(--shadow)}
.key:active{transform:translateY(3px); box-shadow:inset 0 -2px 0 var(--line)}
.key.ok{background:linear-gradient(180deg,color-mix(in srgb,var(--ok) 75%,#fff),var(--ok)); color:#fff; box-shadow:inset 0 -6px 0 color-mix(in srgb,var(--ok) 65%,#000)}
.key.del{font-size:1.5rem}
.split{display:flex; flex-wrap:wrap; gap:24px 40px; align-items:center; justify-content:center; width:100%}

.colop{display:grid; gap:6px; font-variant-numeric:tabular-nums; justify-content:center}
.cell{width:clamp(54px,11vw,70px); height:clamp(58px,11vw,74px); display:grid; place-items:center; font-size:clamp(2.1rem,6vw,2.9rem); font-weight:700; border-radius:14px}
.cell.in{border:4px dashed var(--c); background:var(--paper)}
.cell.carry{height:42px; font-size:1.4rem; border:3px dashed color-mix(in srgb,var(--c) 40%,var(--line)); color:var(--ink-soft); background:transparent}
.cell.sel{border-style:solid; box-shadow:0 0 0 5px color-mix(in srgb,var(--c) 25%,transparent)}
.cell.bad{border-color:var(--ko); color:var(--ko); background:var(--ko-bg)}
.cell.good{border-color:var(--ok); color:var(--ok); background:var(--ok-bg)}
.cell.sign{color:var(--c)}
.opline{grid-column:1/-1; height:6px; border-radius:3px; background:var(--ink)}
.carry-lbl{grid-column:1/-1; font-size:.85rem; color:var(--ink-soft); text-align:right; margin-bottom:-4px}

.blocks{display:flex; flex-wrap:wrap; gap:18px; align-items:flex-end; justify-content:center; max-width:740px}
.bgroup{display:flex; flex-wrap:wrap; gap:6px; align-items:flex-end; max-width:340px}
.blk-c{width:92px; height:92px; background-color:var(--mates); border-radius:6px; box-shadow:inset 0 -4px 0 rgba(0,0,0,.2);
  background-image:linear-gradient(rgba(255,255,255,.35) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.35) 1px,transparent 1px); background-size:9.2px 9.2px}
.blk-d{width:12px; height:92px; background-color:var(--cono); border-radius:5px; box-shadow:inset -2px -3px 0 rgba(0,0,0,.2); background-image:linear-gradient(rgba(255,255,255,.35) 1px,transparent 1px); background-size:100% 9.2px}
.blk-u{width:14px; height:14px; background:var(--lectura); border-radius:4px; box-shadow:inset 0 -3px 0 rgba(0,0,0,.2)}
.blk-legend{display:flex; flex-wrap:wrap; gap:6px 18px; justify-content:center; color:var(--ink-soft); font-size:.95rem}

.groups{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; max-width:720px}
.grp{min-width:56px; min-height:56px; padding:6px 8px; border-radius:18px; display:flex; flex-wrap:wrap; gap:2px; align-items:center; justify-content:center; font-size:1.35rem; max-width:112px;
  background:color-mix(in srgb,var(--c) 10%,var(--card)); border:3px solid color-mix(in srgb,var(--c) 45%,var(--line))}
.grp.empty{border-style:dashed}

.numline{width:100%; max-width:660px; height:auto; overflow:visible}
.numline .axis{stroke:var(--ink); stroke-width:5; stroke-linecap:round}
.numline .tick{stroke:var(--ink-soft); stroke-width:2.5}
.numline .tick.mid{stroke:var(--ink); stroke-width:3.5}
.numline text{fill:var(--ink); font-family:var(--f-read); font-weight:700; font-size:22px}
.numline .mark{fill:var(--c)} .numline .mark-t{fill:var(--c); font-size:28px; font-family:var(--f-display); font-weight:800}

.tiles{display:flex; flex-wrap:wrap; gap:12px; justify-content:center; max-width:660px}
.tile{min-width:78px; min-height:78px; padding:6px 18px; border-radius:20px; border:0; color:var(--on-c); font-size:2.1rem; font-weight:700; text-shadow:0 2px 0 rgba(0,0,0,.15);
  background:linear-gradient(180deg,color-mix(in srgb,var(--c) 75%,#fff),var(--c)); box-shadow:inset 0 -6px 0 color-mix(in srgb,var(--c) 68%,#000),0 6px 12px color-mix(in srgb,var(--c) 30%,transparent)}
.tile:active{transform:translateY(3px) scale(.97)}
.tile.used{visibility:hidden}
.slots{display:flex; flex-wrap:wrap; gap:8px; justify-content:center; min-height:80px}
.slot{min-width:62px; height:76px; padding:0 10px; border-bottom:6px solid var(--line); display:grid; place-items:center; font-size:2.5rem; font-weight:700}
.slot.on{border-color:var(--c); animation:popin .3s both}
.slots.good .slot{border-color:var(--ok); color:var(--ok)}

.sentence{display:flex; flex-wrap:wrap; gap:10px; justify-content:center; max-width:740px}

<script>
"use strict";
/* ---------- utilidades ---------- */
const $=(s,r=document)=>r.querySelector(s);
function h(tag,a,...kids){
  const el=document.createElement(tag);
  if(a) for(const k in a){
    const v=a[k]; if(v==null||v===false) continue;
    if(k==='class') el.className=v;
    else if(k.startsWith('on')&&typeof v==='function') el.addEventListener(k.slice(2),v);
    else if(k==='style'&&typeof v==='object') Object.assign(el.style,v);
    else el.setAttribute(k,v===true?'':v);
  }
  for(const c of kids.flat(Infinity)) if(c!=null&&c!==false) el.append(c.nodeType?c:document.createTextNode(String(c)));
  return el;
}
const rnd=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=arr=>arr[Math.floor(Math.random()*arr.length)];
function shuffle(arr){const a=arr.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
const pickN=(arr,n)=>shuffle(arr).slice(0,n);
function deck(arr){let pool=[];return ()=>{if(!pool.length)pool=shuffle(arr);return pool.pop();};}
const cap=s=>s[0].toUpperCase()+s.slice(1);
const reduced=matchMedia('(prefers-reduced-motion: reduce)').matches;
const IMG={wave:'img/mochi-wave.png',happy:'img/mochi-happy.png',think:'img/mochi-think.png',read:'img/mochi-read.png'};
const XIMG={wave:'img/explora-wave.png',happy:'img/explora-happy.png',think:'img/explora-look.png',read:'img/explora-look.png'};
let CUR_SUB=null;
const pic=k=>(CUR_SUB==='cono'&&XIMG[k])||IMG[k];
const mochi=(k,cls='')=>h('img',{class:'mochi '+cls,src:pic(k),alt:'Mochi, la mochila'});
const pane2=(l,r,cls='')=>h('div',{class:'pane2 '+cls},h('div',{class:'pane'},l),h('div',{class:'pane'},r));

/* ---------- datos guardados en este dispositivo ---------- */
const KEY='mochila2-v1';
const AVATARS=['🦊','🐼','🦁','🐸','🐙','🦄','🐢','🐝','🐬','🦖','🐱','🐶','🐰','🦉','🐨','🐯'];
let DB={players:[],cur:null,sound:true,opt:{}};
try{const s=JSON.parse(localStorage.getItem(KEY)||'null'); if(s&&Array.isArray(s.players)) DB=Object.assign(DB,s);}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(DB));}catch(e){}}
function me(){return DB.players.find(p=>p.id===DB.cur)||null;}

íen mucho.":[3,46.22,1.64],"Mañana voy al cine.":[3,48.16,1.28],"La niña salta a la comba.":[3,49.74,1.64],"Echa un poco de sal a la sopa.":[3,51.68,1.74],"Me gustan las fresas.":[3,53.72,1.46],"Mi casa es grande.":[3,55.48,1.24],"El perro ladra.":[3,57.02,1.12],"Ese es mi libro.":[3,58.44,1.16],"Lucía tiene 383 cromos.":[3,59.9,2.82],"A Hugo le quedan 217 canicas.":[3,63.02,2.82],"En total hay 283 galletas.":[3,66.14,2.66],"En el tren quedan 255 pasajeros.":[3,69.1,3.08],"Martina ha leído 125 páginas en total.":[3,72.48,3.14],"En el zoo quedan 54 pájaros.":[3,75.92,2.48],"A Leo le faltan 174 pegatinas.":[3,78.7,2.84],"Ese día van al cine 623 personas.":[3,81.84,3.24],"En el huerto hay 121 plantas.":[3,85.38,2.5],"A Sofía le quedan 66 euros.":[3,88.18,2.42],"En el colegio hay 611 alumnos.":[3,90.9,2.54],"A la granja le quedan 355 gallinas.":[3,93.74,3.18],"¿Dónde duerme Pincho durante el día?":[4,0.3,1.94],"¿Qué come Pincho?":[4,2.54,1.18],"¿Por qué se convierte Pincho en una bola de púas?":[4,4.02,2.7],"¿Qué tiempo había hecho la noche antes de que la abuela viera las huellas?":[4,7.02,3.46],"¿Cuántos años cumple Leo?":[4,10.78,1.52],"¿Dónde juegan al escondite?":[4,12.6,1.6],"¿Cuántos amigos del cole van a la fiesta?":[4,14.5,2.26],"¿Cómo se siente Leo al final del día?":[4,17.06,2.04],"¿Para qué estira el cuello la jirafa?":[4,19.4,1.78],"¿Cuántas patas tiene la araña?":[4,21.48,1.76],"¿Tiene huesos la jirafa?":[4,23.54,1.42],"¿Qué necesitan los pingüinos en el zoo?":[4,25.26,2.0],"¿Qué quería hacer Marta?":[4,27.56,1.34],"¿Qué sacó el abuelo?":[4,29.2,1.18],"¿Cómo se sentía Marta al mirar por la ventana?":[4,30.68,2.44],"Al final, ¿se lo pasó bien Marta?":[4,33.42,2.28],"¿Qué hacía la hormiga en verano?":[4,36.0,1.6],"¿Qué instrumento tocaba el saltamontes?":[4,37.9,2.18],"¿Por qué llamó el saltamontes a la puerta de la hormiga?":[4,40.38,2.64],"¿Quién pensó antes en el invierno?":[4,43.32,1.82],"¿De qué color es Burbuja?":[4,45.44,1.5],"¿Cuándo le da de comer Daniel?":[4,47.24,1.54],"¿Qué le puso Daniel en la pecera?":[4,49.08,1.78],"¿Le gusta a Burbuja el barco?":[4,51.16,1.68],"¿Qué día fueron de excursión?":[4,53.14,1.6],"¿Cómo llegaron al castillo?":[4,55.04,1.54],"¿Quién vivió en el castillo hace muchos años?":[4,56.88,2.62],"¿Por qué Nora sujetaba la gorra con la mano?":[4,59.8,2.34],"¿Cómo es Pelusa?":[4,62.44,1.12],"¿Dónde le gusta dormir?":[4,63.86,1.38],"¿Qué dejó la abuela encima del sofá?":[4,65.54,1.96],"¿Cómo estaba el salón cuando volvió la abuela?":[4,67.8,2.218],"Lucía tiene 245 cromos. Su abuela le regala 138 cromos más. ¿Cuántos cromos tiene ahora?":[5,0.3,7.36],"Hugo tenía 362 canicas y le da 145 a sus amigos. ¿Cuántas canicas le quedan?":[5,7.96,6.44],"En una caja hay 156 galletas y en otra caja hay 127. ¿Cuántas galletas hay en total?":[5,14.7,6.82],"Un tren lleva 430 pasajeros. En la estación se bajan 175. ¿Cuántos pasajeros quedan en el tren?":[5,21.82,7.36],"Martina leyó 68 páginas la semana pasada y 57 páginas esta semana. ¿Cuántas páginas ha leído en total?":[5,29.48,7.48],"En el zoo hay 92 pájaros. Se van volando 38. ¿Cuántos pájaros quedan?":[5,37.26,5.36],"Leo quiere juntar 500 pegatinas. Ya tiene 326. ¿Cuántas pegatinas le faltan?":[5,42.92,6.1],"Al cine van 248 personas por la mañana y 375 por la tarde. ¿Cuántas personas van al cine ese día?":[5,49.32,7.96],"En el huerto del cole hay 75 lechugas y 46 tomateras. ¿Cuántas plantas hay en total?":[5,57.58,5.9],"Sofía tenía 85 euros en su hucha. Se compra un libro de 19 euros. ¿Cuánto dinero le queda?":[5,63.78,6.66],"En el colegio hay 315 niños y 296 niñas. ¿Cuántos alumnos hay en total?":[5,70.74,6.06],"Una granja tiene 640 gallinas. Vende 285. ¿Cuántas gallinas le quedan?":[5,77.1,6.371],"Pincho es un erizo pequeño que vive en el jardín de la abuela Carmen. Por el día duerme debajo de un montón de hojas secas. Cuando se hace de noche, sale a buscar caracoles y gusanos para comer. Si un perro se acerca, Pincho se convierte en una bola llena de púas. Una mañana, la abuela encontró sus huellas en la tierra mojada.":[6,0.3,19.566],"Hoy Leo cumple siete años. Su madre ha preparado una tarta de chocolate con siete velas. A la fiesta vienen sus amigos del cole: Sara, Iván y Nora. Juegan al escondite en el patio hasta que se hace de noche. Cuando Leo sopla las velas, todos aplauden. Antes de dormir, Leo dice: «¡Ha sido el mejor día del año!».":[6,20.166,19.859],"La clase de segundo fue de visita al zoo. La jirafa estiraba su cuello largo para comer las hojas más altas. Los pingüinos nadaban muy rápido, pero ninguno echaba a volar. En el terrario había una araña enorme con ocho patas y una mariposa azul. La seño explicó que la araña y la mariposa no tienen huesos: son animales invertebrados.":[6,40.325,19.879],"Marta quería ir al parque con su bici nueva, pero empezó a llover muy fuerte. Se quedó mirando por la ventana con la cara muy seria. Entonces su abuelo sacó una caja de pinturas y un montón de folios. Pasaron la tarde pintando dragones, castillos y barcos. Cuando salió el arcoíris, Marta ya no se acordaba de la bici.":[6,60.504,18.22],"Durante todo el verano, la hormiga trabajaba sin parar y guardaba comida en su hormiguero. El saltamontes, en cambio, se pasaba el día cantando y tocando la guitarra. «¿Por qué trabajas tanto?», le preguntaba. Cuando llegó el invierno, hacía mucho frío y en el campo no quedaba comida. Una mañana, el saltamontes llamó a la puerta de la hormiga con la tripa vacía.":[6,79.024,22.58],"Burbuja es un pez naranja que vive en una pecera redonda, en casa de Daniel. Todas las mañanas, antes de ir al cole, Daniel le echa un poquito de comida. A Burbuja le encanta esconderse detrás de una piedra verde. Un sábado, Daniel limpió la pecera y le puso un barco pirata pequeñito. Desde ese día, Burbuja nada sin parar alrededor del barco.":[6,101.904,21.159],"El viernes, la clase de segundo fue de excursión a un castillo muy antiguo. Subieron en autobús por una carretera llena de curvas. Arriba, el guía les enseñó la torre más alta y les contó que allí vivieron caballeros hace muchísimos años. Hacía mucho viento y Nora tuvo que sujetar su gorra con la mano. Antes de volver, se comieron los bocadillos sentados junto a la muralla.":[6,123.363,22.007],"Pelusa es una gatita blanca con una mancha negra en la oreja. Le encanta dormir al sol en la terraza. Una tarde, la abuela dejó un ovillo de lana roja encima del sofá. Pelusa dio un salto, lo tiró al suelo y empezó a jugar con él. Cuando la abuela volvió, ¡había lana roja por todo el salón!":[6,145.671,17.868],"en:cat":[7,0.3,0.82],"en:dog":[7,1.42,0.82],"en:fish":[7,2.54,0.74],"en:bird":[7,3.58,0.82],"en:duck":[7,4.7,0.8],"en:cow":[7,5.8,0.76],"en:pig":[7,6.86,0.7],"en:frog":[7,7.86,0.7],"en:lion":[7,8.86,0.94],"en:bee":[7,10.1,0.74],"en:bear":[7,11.14,0.82],"en:mouse":[7,12.26,1.0],"en:apple":[7,13.56,0.76],"en:banana":[7,14.62,0.92],"en:egg":[7,15.84,0.72],"en:milk":[7,16.86,0.78],"en:cake":[7,17.94,0.76],"en:pizza":[7,19.0,0.78],"en:bread":[7,20.08,0.78],"en:cheese":[7,21.16,0.98],"en:orange":[7,22.44,0.92],"en:grapes":[7,23.66,0.98],"en:sun":[7,24.94,0.8],"en:star":[7,26.04,0.9],"en:moon":[7,27.24,0.8],"en:tree":[7,28.34,0.7],"en:car":[7,29.34,0.76],"en:bus":[7,30.4,0.96],"en:ball":[7,31.66,0.84],"en:book":[7,32.8,0.82],"en:pen":[7,33.92,0.72],"en:bed":[7,34.94,0.72],"en:house":[7,35.96,0.94],"en:hat":[7,37.2,0.82],"en:kite":[7,38.32,0.78],"en:bike":[7,39.4,0.82],"en:red":[7,40.52,0.7],"en:blue":[7,41.52,0.84],"en:green":[7,42.66,0.86],"en:yellow":[7,43.82,0.78],"en:purple":[7,44.9,0.8],"en:black":[7,46.0,0.86],"en:white":[7,47.16,0.8],"en:brown":[7,48.26,0.86],"¿En qué continente vive? Tócalo en el mapa.":[8,0.3,2.9],"¿Dónde vive este animal? Elige su casa.":[8,3.5,2.76],"¿Qué come este animal?":[8,6.56,1.26],"¿Cómo nace: de la tripa de su madre o de un huevo?":[8,8.12,2.94],"¿Verdadero o falso?":[8,11.36,1.4],"Este es tu álbum de animales. Cada vez que aciertas una pregunta de animales, consigues un cromo nuevo. Toca un cromo para ver su ficha.":[8,13.06,7.74],"Conocimiento del medio":[8,21.1,1.48],"La selva es un bosque muy caluroso y húmedo, lleno de árboles y de lluvia.":[8,22.88,4.28],"La sabana es una llanura enorme de hierba alta, con pocos árboles.":[8,27.46,3.68],"En el desierto casi nunca llueve y hay mucha arena.":[8,31.44,3.0],"En los polos hace muchísimo frío y casi todo está cubierto de hielo.":[8,34.74,4.2],"Los océanos son mares inmensos de agua salada.":[8,39.24,3.02],"Los ríos y los lagos tienen agua dulce.":[8,42.56,2.4],"En el bosque hay muchos árboles y en invierno hace frío.":[8,45.26,3.14],"En la montaña hay rocas, cuestas empinadas y mucho frío en lo alto.":[8,48.7,4.28],"En la granja viven animales que cuidan las personas.":[8,53.28,2.84],"Los herbívoros comen plantas: hierba, hojas, semillas y frutas.":[8,56.42,4.6],"Los carnívoros comen otros animales.":[8,61.32,2.16],"Los omnívoros comen de todo: plantas y animales.":[8,63.78,3.12],"Los vivíparos nacen de la tripa de su madre.":[8,67.2,2.44],"Los ovíparos nacen de un huevo.":[8,69.94,1.94],"Vive en África, en las selvas del Congo y de otros países cercanos.":[8,72.18,3.94],"Es el mono más grande del mundo y vive en familias. Come sobre todo hojas, tallos y frutas.":[8,76.42,6.42],"Vive en África, en la sabana, por ejemplo en Kenia y Tanzania.":[8,83.14,3.64],"Vive en grupos llamados manadas. Las leonas son las que más cazan.":[8,87.08,4.38],"Vive en África, en la sabana.":[8,91.76,1.92],"Es el animal más alto del mundo. Con su cuello largo come las hojas de los árboles más altos.":[8,93.98,5.78],"El elefante africano vive en África, en la sabana y en la selva.":[8,100.06,3.66],"Es el animal más grande de la tierra. Usa la trompa para beber, oler, coger cosas y saludar.":[8,104.02,6.24],"cebra":[8,110.56,0.698],"Cada cebra tiene sus rayas diferentes, como nuestras huellas de los dedos.":[8,111.558,4.0],"hipopótamo":[8,115.858,1.0],"Vive en África, en los ríos y lagos.":[8,117.158,2.38],"Pasa el día dentro del agua para no quemarse con el sol y sale de noche a comer hierba.":[8,119.838,4.4],"Es el animal más rápido de la tierra: corre casi tan rápido como un coche en la autovía.":[8,124.538,4.58],"dromedario":[8,129.418,0.9],"Vive en los desiertos de África, como el Sáhara.":[8,130.618,2.6],"Tiene una sola joroba. Su primo el camello tiene dos.":[8,133.518,3.14],"camello":[8,136.957,0.7],"Vive en los desiertos de Asia, como el desierto de Gobi, en Mongolia.":[8,137.957,3.7],"Tiene dos jorobas llenas de grasa y aguanta muchos días sin beber agua.":[8,141.957,3.74],"panda":[8,145.998,0.62],"Vive en Asia, en los bosques de bambú de las montañas de China.":[8,146.918,3.36],"Se pasa casi todo el día comiendo bambú.":[8,150.578,2.26],"Vive en Asia, en las selvas y bosques de la India y de otros países.":[8,153.138,3.76],"Es el felino más grande del mundo y, al contrario que los gatos, le encanta nadar.":[8,157.198,4.44],"orangután":[8,161.937,0.94],"Vive en Asia, en las selvas de las islas de Borneo y Sumatra.":[8,163.177,3.34],"Su nombre significa «persona del bosque». Pasa casi toda su vida en los árboles.":[8,166.817,4.54],"Vive en Oceanía, en Australia.":[8,171.657,2.02],"Avanza dando saltos enormes. Su cría crece dentro de una bolsa en la tripa de su madre.":[8,173.977,5.62],"koala":[8,179.897,0.7],"Vive en Oceanía, en los bosques de eucaliptos de Australia.":[8,180.897,3.2],"Come hojas de eucalipto y duerme casi todo el día, ¡unas veinte horas!":[8,184.397,3.8],"El pingüino emperador vive en la Antártida, en el Polo Sur.":[8,188.497,3.14],"No sabe volar, pero nada rapidísimo. El papá cuida el huevo entre sus patas.":[8,191.937,5.12],"oso polar":[8,197.357,0.86],"Vive en el Ártico, cerca del Polo Norte, por ejemplo en Canadá.":[8,198.517,3.48],"Su pelo parece blanco para esconderse en la nieve, pero su piel es negra.":[8,202.297,3.82],"bisonte":[8,206.417,0.84],"Vive en América del Norte, en las praderas de Estados Unidos y Canadá.":[8,207.557,3.68],"Es el animal más pesado de América del Norte.":[8,211.537,2.52],"mapache":[8,214.357,0.82],"Vive en América del Norte, en bosques cerca de ríos.":[8,215.477,4.158],"Parece que lleva un antifaz y moja la comida en el agua antes de comérsela.":[8,219.935,3.72],"Vive en América del Sur, en las montañas de los Andes, en Perú y Bolivia.":[8,223.955,4.26],"Si se enfada, ¡escupe! Su lana es muy calentita.":[8,228.515,3.54],"perezoso":[8,232.355,0.84],"Vive en América del Sur, en la selva del Amazonas, en Brasil.":[8,233.495,3.62],"Es tan lento que en su pelo crecen algas verdes.":[8,237.415,2.76],"guacamayo":[8,240.475,0.9],"Vive en América del Sur, en la selva del Amazonas.":[8,241.675,2.92],"Tiene plumas de muchos colores y un pico muy fuerte para romper semillas.":[8,244.895,4.0],"lince ibérico":[8,249.195,1.16],"Vive solo en España y Portugal. En Andalucía vive en Doñana y en Sierra Morena, muy cerca de Córdoba.":[8,250.655,6.2],"Estuvo a punto de desaparecer, pero gracias a los cuidados ya hay más de dos mil. Le encantan los conejos.":[8,257.155,6.34],"lobo ibérico":[8,263.795,1.12],"Vive en Europa, en los montes del norte de España, como en Zamora y Asturias.":[8,265.215,4.36],"Vive en manadas y aúlla para hablar con los demás lobos.":[8,269.875,2.88],"oso pardo":[8,273.055,0.9],"En España vive en las montañas del norte: en Asturias, Cantabria y León.":[8,274.255,4.14],"En invierno se mete en una cueva y duerme mucho: hiberna. Su cría se llama osezno.":[8,278.695,5.62],"cigüeña":[8,284.615,0.74],"En primavera y verano vive en España. En invierno, muchas viajan a África.":[8,285.655,4.68],"Hace nidos enormes en lo alto de las torres y los campanarios, y vuelve a ellos cada año.":[8,290.635,4.88],"flamenco":[8,295.815,0.8],"En España podemos verlo en Doñana y en la laguna de Fuente de Piedra, en Málaga.":[8,296.915,4.4],"Es rosa por los camarones que come, y le encanta dormir sobre una sola pata.":[8,301.615,4.3],"Vive en todos los océanos del mundo.":[8,306.215,2.04] function openGame(id){const g=GAMES[id]; if(g.options) setupScreen(g); else begin(g,null);}
function setupScreen(g){
  const sid=g.subject; CUR_SUB=sid; let chosen=(DB.opt&&DB.opt[g.id])||g.options.choices[0].id;
  if(!g.options.choices.some(c=>c.id===chosen)) chosen=g.options.choices[0].id;

  mount(h('div',{class:'game','data-notop':'1',style:`--c:var(--${sid})`},
    gameHead(sid,SUBJ[sid].name),
    h('section',{class:'stage'},h('div',{class:'setup'},h('div',{class:'setup-icon','aria-hidden':'true'},g.icon),h('h2',null,g.title),h('p',null,g.long||g.desc),
      h('strong',null,g.options.label),chips,
      h('button',{class:'btn big',style:`--c:var(--${sid})`,onclick:()=>{DB.opt=DB.opt||{};DB.opt[g.id]=chosen;save();sfx.pop();begin(g,chosen);}},'¡A jugar! ▶')))));
  instr(g.title,SAY.pickOpt);
}
function begin(g,opt){
  const run={g,opt,i:0,total:g.rounds||8,score:0,missed:false,locked:false,data:{}};
  RUN=run; CUR_SUB=g.subject; if(g.prepare) g.prepare(run);
  const prog=h('div',{class:'prog','aria-hidden':'true'},g.custom?[]:Array.from({length:run.total},()=>h('span',{class:'seg'})),g.custom?null:h('span',{class:'goal'},'★'));
  const stage=h('section',{class:'stage'});
  mount(h('div',{class:'game','data-notop':'1',style:`--c:var(--${g.subject})`},gameHead(g.subject,g.icon+' '+g.title,prog),stage));
  run.stage=stage; run.segs=[...prog.querySelectorAll('.seg')]; run.ctx=makeCtx(run);
  if(g.custom) return g.custom(stage,run,run.ctx);
  if(g.intro) return g.intro(stage,run,()=>{if(RUN===run) nextQ(run);});
  nextQ(run);
}
function nextQ(run){
  if(RUN!==run) return;
  if(run.i>=run.total) return finish(run);
  run.missed=false; run.locked=false;
  run.segs.forEach((d,k)=>d.classList.toggle('cur',k===run.i));
  hideFb(); stopVoice(); run.stage.replaceChildren();
  const q=run.g.make(run); run.q=q;
  run.g.render(q,run.stage,run.ctx,run);
  scrollTo({top:0});
}
function makeCtx(run){
  return {
    right(msg,v={}){ if(RUN!==run||run.locked) return; run.locked=true; sfx.ok(); if(!run.missed) run.score++;
      if(run.g.subject==='cono'&&run.q&&run.q.n&&typeof unlockAnimal==='function'&&unlockAnimal(run.q.n)) msg=(msg?msg+' ':'')+'🃏 ¡Cromo nuevo para tu álbum!';
      const d=run.segs[run.i]; if(d){d.classList.remove('cur');d.classList.add(run.missed?'miss':'ok');}
      const p=pick(PRAISE); showFb('ok',p,msg,()=>{run.i++;nextQ(run);});
      if(DB.sound||v.force) speakSeq([v.pre,p,v.post]); },
    wrong(msg){ if(RUN!==run||run.locked) return; run.missed=true; sfx.ko(); const r=pick(RETRY); showToast(r,msg||'');
      if(DB.sound) speak(r); },
    finish(stars,msg){ if(RUN!==run) return; finish(run,stars,msg); }
  };
}
function finish(run,stars,msg){
  const g=run.g;
  if(stars==null){const pct=run.score/run.total; stars=pct>=.9?3:pct>=.6?2:1; msg=`Has acertado ${run.score} de ${run.total} a la primera.`;}
  setStars(g.id,stars); RUN=null; hideFb(); sfx.win(); if(stars>=2) confetti();
  run.segs.forEach(d=>d.classList.remove('cur'));
  const title=END_T[stars-1];
  run.stage.replaceChildren(h('div',{class:'end'},
    h('div',{class:'end-stars',role:'img','aria-label':stars+' estrellas'},[1,2,3].map(n=>h('span',{class:n<=stars?'on':''},'★'))),
    mochi('happy'),h('h2',null,title),h('p',null,msg||''),
    h('div',{class:'row center'},h('button',{class:'btn big',onclick:()=>{sfx.pop();begin(g,run.opt);}},'Otra vez ↻'),h('button',{class:'btn ghost big',onclick:()=>backOf(g.subject)()},gamesOf(g.subject).length>1?'Otras actividades':'Volver al inicio'))));
  const coin=$('#coin'); if(coin) coin.textContent=totalStars();
  if(DB.sound) setTimeout(()=>speak(title),500);
}

function choices(list,correct,ctx,{wide=false,cls='',explain,hint,voice,onPick}={}){
  const box=h('div',{class:'opts'+(wide?' wide':'')+(cls?' '+cls:'')});
  list.forEach(item=>{
    const obj=item&&typeof item==='object'&&!item.nodeType;
    const val=obj?item.value:item, lab=obj?item.label:String(item);
    const b=h('button',{class:'opt',onclick:()=>{
      if(val===correct){b.classList.add('ok');burst(b);box.querySelectorAll('.opt').forEach(x=>x.classList.add('lock'));onPick&&onPick(true,val);ctx.right(typeof explain==='function'?explain():explain,typeof voice==='function'?voice():voice);}
      else{b.classList.add('ko');onPick&&onPick(false,val);ctx.wrong(typeof hint==='function'?hint(val):hint);}
    }},lab);
    box.append(b);
  });
  return box;
}
function keypad(onKey){
  return h('div',{class:'keypad'},['1','2','3','4','5','6','7','8','9','del','0','ok'].map(c=>
    h('button',{class:'key'+(c==='del'?' del':c==='ok'?' ok':''),'aria-label':c==='del'?'Borrar':c==='ok'?'Comprobar':c,onclick:()=>{sfx.tap();onKey(c);}},c==='del'?'⌫':c==='ok'?'✓':c)));
}
function numAnswer(answer,ctx,{explain,hint,voice}={}){
  let val='',tries=0,clearNext=false;
  const disp=h('div',{class:'ans empty','aria-live':'polite'},'?');
  const max=Math.max(String(answer).length+1,3);
  const upd=()=>{disp.textContent=val||'?';disp.classList.toggle('empty',!val);};
  const kp=keypad(c=>{
    if(disp.classList.contains('good')) return;
    if(clearNext&&c!=='ok'){val='';clearNext=false;disp.classList.remove('bad');}
    if(c==='del') val=val.slice(0,-1);
    else if(c==='ok'){
      if(!val||clearNext) return;
      if(Number(val)===answer){disp.classList.add('good');ctx.right(typeof explain==='function'?explain():explain,voice);}
      else{tries++;disp.classList.remove('bad');void disp.offsetWidth;disp.classList.add('bad');clearNext=true;ctx.wrong(tries>=2?`Pista: es el ${answer}. Escríbelo.`:(typeof hint==='function'?hint(Number(val)):hint)||'');return;}
    }
    else if(val.length<max) val=(val==='0'?'':val)+c;
    upd();
  });
  return {disp,kp};
}
const U=['cero','uno','dos','tres','cuatro','cinco','seis','siete','ocho','nueve','diez','once','doce','trece','catorce','quince','dieciséis','diecisiete','dieciocho','diecinueve','veinte','veintiuno','veintidós','veintitrés','veinticuatro','veinticinco','veintiséis','veintisiete','veintiocho','veintinueve'];
const T=['','','','treinta','cuarenta','cincuenta','sesenta','setenta','ochenta','noventa'];
const C=['','ciento','doscientos','trescientos','cuatrocientos','quinientos','seiscientos','setecientos','ochocientos','novecientos'];
function words(n){if(n<30)return U[n];if(n<100){const t=Math.floor(n/10),u=n%10;return T[t]+(u?' y '+U[u]:'');}if(n===100)return 'cien';const c=Math.floor(n/100),r=n%100;return C[c]+(r?' '+words(r):'');}

function parseGap(s,cat){const [w,e]=s.split('|');const m=w.match(/^(.*)\[(.+)\](.*)$/);return {pre:m[1],ans:m[2],post:m[3],word:m[1]+m[2]+m[3],emoji:e,cat};}
function ortoRule(q){
  switch(q.cat){
    case 'mn': return q.ans==='m'?RULE.mn_m:RULE.mn_n;
    case 'rr': return q.ans==='rr'?RULE.rr_rr:(q.pre===''?RULE.rr_start:RULE.rr_soft);
    case 'cz': return q.ans==='z'?(q.post===''?RULE.cz_zend:RULE.cz_z):RULE.cz_c;
    case 'cqu': return q.ans==='qu'?RULE.cqu_qu:RULE.cqu_c;
    case 'ggu': return q.ans==='gu'?RULE.ggu_gu:RULE.ggu_g;
    default: return null;
  }
}
defGame({id:'faltas',subject:'lengua',icon:'🔍',title:'Cazafaltas',desc:'¿Qué letra falta? m/n, r/rr, c/z, c/qu, g/gu, ch/ll',
  long:'Mira el dibujo, escucha la palabra y elige la letra que falta.',
  options:{label:'¿Qué quieres practicar?',choices:[{id:'all',label:'Todo mezclado'},...Object.entries(ORTO).map(([id,c])=>({id,label:c.label}))]},
  prepare(run){const cats=run.opt==='all'?Object.keys(ORTO):[run.opt];const all=cats.flatMap(c=>ORTO[c].items.map(s=>parseGap(s,c)));run.data.next=deck(all);},
  make(run){return run.data.next();},
  render(q,stage,ctx,run){
    const gap=h('span',{class:'gap empty'}); const rule=ortoRule(q);
    stage.append(pane2([h('div',{class:'q-emoji','aria-hidden':'true'},q.emoji),
      h('div',{class:'with-say'},h('div',{class:'word'},q.pre,gap,q.post),sayBtn(q.word))],
      [h('p',{class:'q-note',style:'margin:0'},'Toca la letra que falta'),
      choices(ORTO[q.cat].opts,q.ans,ctx,{explain:rule?`${rule} → ${q.word}`:`Se escribe con ${q.ans}: ${q.word}.`,voice:{pre:q.word,post:rule},
        hint:'Escucha la palabra otra vez y fíjate en la letra que va detrás.',
        onPick:ok=>{if(ok){gap.textContent=q.ans;gap.className='gap fill';}}})]));
    if(run.i===0) instr(SAYL.faltas,q.word); else instr(q.word);
  }});

const SILABAS=['ma-ri-po-sa|🦋','pe-lo-ta|⚽','ca-mión|🚚','te-lé-fo-no|☎️','e-le-fan-te|🐘','to-ma-te|🍅','co-ne-jo|🐰','tor-tu-ga|🐢','ma-le-ta|🧳','bi-ci-cle-ta|🚲','pa-ra-guas|☂️','he-la-do|🍦','ca-ra-col|🐌','fre-sa|🍓','dra-gón|🐉','es-tre-lla|⭐','ár-bol|🌳','man-za-na|🍎','pá-ja-ro|🐦','za-pa-to|👞','mo-chi-la|🎒','ji-ra-fa|🦒','co-co-dri-lo|🐊','pi-ra-ta|🏴‍☠️','cas-ti-llo|🏰','ca-ba-llo|🐴','pin-tu-ra|🎨'].map(s=>{const [w,e]=s.split('|');return {sy:w.split('-'),word:w.replace(/-/g,''),emoji:e};});
defGame({id:'silabas',subject:'lengua',icon:'🧩',title:'Sílabas',desc:'Ordena las sílabas y aprende dónde cortar al cambiar de renglón',
  prepare(run){run.data.next=deck(SILABAS);},
  make(run){const w=run.data.next();return {...w,mode:run.i%2?'cut':'order'};},
  render(q,stage,ctx){
    if(q.mode==='order'){
      let k=0; const slots=h('div',{class:'slots'},q.sy.map(()=>h('span',{class:'slot'})));
      let order=shuffle(q.sy); for(let t=0;t<5&&order.join()===q.sy.join()&&q.sy.length>1;t++) order=shuffle(q.sy);
      const tiles=h('div',{class:'tiles'},order.map(s=>{const b=h('button',{class:'tile',onclick:()=>{
        if(b.classList.contains('used')||k>=q.sy.length) return;
        if(s===q.sy[k]){b.classList.add('used');slots.children[k].textContent=s;slots.children[k].classList.add('on');k++;sfx.pop();
          if(k===q.sy.length){slots.classList.add('good');burst(slots);ctx.right(`${q.sy.join(' - ')}: tiene ${q.sy.length} sílabas.`,{pre:q.word});}}
        else{b.classList.remove('shake');void b.offsetWidth;b.classList.add('shake');ctx.wrong('Di la palabra despacio y da una palmada en cada sílaba.');}
      }},s);return b;}));
      slots.style.position='relative';
      stage.append(pane2([h('div',{class:'q-prompt'},'Ordena las sílabas'),h('div',{class:'with-say'},h('div',{class:'q-emoji','aria-hidden':'true'},q.emoji),sayBtn(q.word))],[slots,tiles]));
      instr(SAYL.silOrder,q.word);
    } else {
      const w=q.word, bounds=[]; let acc=0; q.sy.slice(0,-1).forEach(s=>{acc+=s.length;bounds.push(acc);});
      const okB=bounds.filter(b=>b>=2&&w.length-b>=2); const good=pick(okB.length?okB:bounds);
      const bad=[]; for(let i=1;i<w.length;i++) if(!bounds.includes(i)) bad.push(i);
      const opts=shuffle([good,...pickN(bad,Math.min(2,bad.length))]);
      stage.append(pane2([h('div',{class:'q-prompt'},'No cabe en el renglón. ¿Dónde la corto?'),
        h('div',{class:'with-say'},h('div',{class:'q-emoji','aria-hidden':'true'},q.emoji),sayBtn(q.word)),
        h('p',{class:'q-note',style:'margin:0'},'Solo se puede cortar entre dos sílabas, y se pone un guion al final del renglón.')],[
        choices(opts.map(b=>({value:b,label:h('span',null,w.slice(0,b)+'-',h('br'),w.slice(b))})),good,ctx,{wide:true,voice:{pre:q.word},
          explain:`Sílabas: ${q.sy.join(' - ')}. Se puede cortar en cualquier unión entre sílabas.`,hint:'Separa la palabra en sílabas con palmadas. El corte tiene que caer entre dos sílabas.'})]));
      instr(SAYL.silCut,q.word);
    }
  }});

const MAYUS=['*mi perro se llama *toby.','*lucía y *hugo juegan en el parque.','*el sábado vamos al zoo de *córdoba.','*mañana es el cumpleaños de *pablo.','*mi abuela vive en *sevilla.','*la seño nos lee un cuento.','*el río *guadalquivir es muy largo.','*en *navidad visitamos el belén.','*ayer fuimos al cine con *marta.','*mi gata *luna duerme en el sofá.','*el castillo de *almodóvar es muy alto.','*papá *noel trae regalos.','*los delfines viven en el mar.'];
const mayusText=s=>s.split(' ').map(t=>t.startsWith('*')?cap(t.slice(1)):t).join(' ');
defGame({id:'mayus',subject:'lengua',icon:'🔠',title:'Mayúsculas',desc:'Toca las palabras que empiezan con mayúscula',
  prepare(run){run.data.next=deck(MAYUS);},
  make(run){const s=run.data.next();const toks=[];s.split(' ').forEach(t=>{const m=t.match(/^(\*?)(.+?)([.,]?)$/);toks.push({w:m[2],need:!!m[1]});if(m[3])toks.push({p:m[3]});});return {s,toks};},
  render(q,stage,ctx,run){
    let done=false;
    const chips=q.toks.map(t=>{
      if(t.p) return h('span',{class:'wchip punct'},t.p);
      const b=h('button',{class:'wchip','aria-pressed':'false',onclick:()=>{if(done)return;t.cap=!t.cap;b.textContent=t.cap?cap(t.w):t.w;b.classList.toggle('cap',t.cap);b.classList.remove('err');b.setAttribute('aria-pressed',String(!!t.cap));sfx.pop();}},t.w);
      t.el=b; return b;});
    const box=h('div',{class:'sentence',style:'position:relative'},chips);
    const check=h('button',{class:'btn big',onclick:()=>{
      const ws=q.toks.filter(t=>!t.p), bad=ws.filter(t=>!!t.cap!==t.need);
      if(!bad.length){done=true;ws.forEach(t=>t.el.classList.add('good'));check.disabled=true;burst(box);ctx.right(SAYL.mayusRule,{pre:mayusText(q.s),post:SAYL.mayusRule});}
      else{bad.forEach(t=>{t.el.classList.remove('err');void t.el.offsetWidth;t.el.classList.add('err');});
        ctx.wrong(bad.some(t=>t.need)?'Falta alguna mayúscula. ¿Cómo empieza la frase? ¿Hay algún nombre?':'Sobra alguna mayúscula: solo la primera palabra y los nombres.');}
    }},'Comprobar ✓');
    stage.append(h('div',{class:'q-prompt'},'Toca las palabras que van con mayúscula'),h('p',{class:'q-note'},'Si te equivocas, tócala otra vez.'),box,check);
    if(run.i===0) instr(SAYL.mayus);
  }});

const NUM_POOL=[101,110,115,120,121,150,199,200,205,212,260,300,345,381,409,432,470,500,515,555,594,600,617,653,700,728,748,777,800,806,865,890,900,911,936,999];
function blocksEl(n){

  return h('div',{class:'blocks','aria-label':`${c} centenas, ${d} decenas y ${u} unidades`},

const blocksLegend=()=>h('div',{class:'blk-legend'},h('span',null,'Cuadrado = 100'),h('span',null,'Barra = 10'),h('span',null,'Cubito = 1'));
function distinct3(){let n;do{n=rnd(102,987);}while(new Set(String(n)).size<3);return n;}
defGame({id:'numeros',subject:'mates',icon:'💯',title:'Números hasta el 999',desc:'Centenas, decenas y unidades, el anterior y el siguiente, mayor y menor',
  prepare(run){run.data.pool=deck(NUM_POOL);},
  make(run){
    const type=['blocks','words','digit','next','compare','blocks','words','next'][run.i%8];
    if(type==='blocks'){const n=Math.random()<.25?rnd(1,9)*100+rnd(1,9):rnd(101,999);return {type,n};}
    if(type==='words') return {type,n:run.data.pool()};
    if(type==='digit'){const n=distinct3();return {type,n,place:rnd(0,2)};}
    if(type==='next'){const after=Math.random()<.5;const n=after?rnd(1,8)*100+pick([9,19,39,59,99,49])-(Math.random()<.5?0:rnd(0,8)):rnd(2,9)*100+pick([0,10,30,50,1]);return {type,n,after};}
    const a=rnd(100,999);const b=Math.random()<.15?a:(Math.random()<.5?Math.floor(a/100)*100+rnd(0,99):rnd(100,999));return {type:'compare',a,b};
  },
  render(q,stage,ctx){
    if(q.type==='blocks'){const {disp,kp}=numAnswer(q.n,ctx,{explain:`${Math.floor(q.n/100)} centenas, ${Math.floor(q.n/10)%10} decenas y ${q.n%10} unidades: ${q.n}.`,hint:'Cuenta primero los cuadrados (centenas), luego las barras (decenas) y luego los cubitos.'});
      stage.append(pane2([h('div',{class:'q-prompt'},'¿Qué número es?'),blocksEl(q.n),blocksLegend()],[disp,kp]));instr(SAYM.blocks);}
    else if(q.type==='words'){const w=words(q.n);const {disp,kp}=numAnswer(q.n,ctx,{explain:`${cap(w)} se escribe ${q.n}.`,hint:'Primero las centenas, luego las decenas y luego las unidades.'});
      stage.append(pane2([h('div',{class:'q-prompt'},'Escribe el número con cifras'),h('div',{class:'with-say'},h('div',{class:'q-prompt',style:'color:var(--c)'},cap(w)),sayBtn(w))],[disp,kp]));instr(SAYM.words,w);}
    else if(q.type==='digit'){const s=String(q.n),ans=s[2-q.place];
      const opts=shuffle([...new Set([...s.split(''),String((+ans+5)%10)])]).slice(0,4);if(!opts.includes(ans))opts[0]=ans;
      stage.append(h('div',{class:'q-prompt'},`¿Qué cifra está en las ${PLACE[q.place]}?`),h('div',{class:'q-big'},q.n),
        choices(shuffle(opts),ans,ctx,{explain:`${s[0]} centenas, ${s[1]} decenas y ${s[2]} unidades.`,hint:'De derecha a izquierda: unidades, decenas, centenas.'}));instr(SAYM.digit[q.place]);}
    else if(q.type==='next'){const ans=q.after?q.n+1:q.n-1;const {disp,kp}=numAnswer(ans,ctx,{explain:q.after?`Después del ${q.n} va el ${ans}.`:`Antes del ${q.n} va el ${ans}.`,hint:q.after?'Suma 1. Si las unidades llegan a 10, cambia la decena.':'Resta 1. Si no hay unidades, coge una decena.'});
      stage.append(pane2([h('div',{class:'q-prompt'},q.after?'¿Qué número va justo después?':'¿Qué número va justo antes?'),h('div',{class:'q-big'},q.after?`${q.n} → ?`:`? → ${q.n}`)],[disp,kp]));instr(q.after?SAYM.next:SAYM.prev);}
    else{const ans=q.a>q.b?'>':q.a<q.b?'<':'=';
      stage.append(h('div',{class:'q-prompt'},'¿Qué signo va en el medio?'),h('div',{class:'q-big'},`${q.a}  ?  ${q.b}`),
        choices([{value:'<',label:'<  menor'},{value:'=',label:'=  igual'},{value:'>',label:'>  mayor'}],ans,ctx,{explain:ans==='='?'Son el mismo número.':`${q.a} ${ans} ${q.b}. El pico apunta al número pequeño.`,hint:'Mira primero las centenas. Si son iguales, mira las decenas.'}));instr(SAYM.compare);}
  }});

function colOp(a,b,op,ctx){
  const res=op==='+'?a+b:a-b, W=Math.max(String(a).length,String(b).length,String(res).length);
  const pad=n=>String(n).padStart(W,' ').split('');
  const A=pad(a),B=pad(b),R=pad(res);
  const grid=h('div',{class:'colop',style:`grid-template-columns:repeat(${W+1},auto)`});
  const resCells=[],carryCells=[];let sel=null;
  const select=c=>{if(sel)sel.classList.remove('sel');sel=c;c.classList.add('sel');};
  grid.append(h('div',{class:'carry-lbl'},'llevadas (si las necesitas)'),h('span'));
  for(let j=0;j<W;j++){if(j<W-1){const c=h('button',{class:'cell carry','aria-label':'Llevada de las '+PLACE[W-1-j],'data-col':j,onclick:()=>select(c)});carryCells.push(c);grid.append(c);}else grid.append(h('span'));}
  grid.append(h('span'));A.forEach(d=>grid.append(h('span',{class:'cell'},d.trim())));
  grid.append(h('span',{class:'cell sign'},op==='+'?'+':'−'));B.forEach(d=>grid.append(h('span',{class:'cell'},d.trim())));
  grid.append(h('div',{class:'opline'}),h('span'));
  for(let j=0;j<W;j++){const c=h('button',{class:'cell in','aria-label':'Resultado, '+PLACE[W-1-j],'data-col':j,onclick:()=>select(c)});resCells.push(c);grid.append(c);}
  select(resCells[W-1]);
  let done=false;
  function hintFor(j){
    const k=W-1-j, da=+(A[j].trim()||0), db=+(B[j].trim()||0);
    if(op==='+'){let carry=0;for(let t=W-1;t>j;t--){const s=+(A[t].trim()||0)+ +(B[t].trim()||0)+carry;carry=s>=10?1:0;}
      const s=da+db+carry;return `En las ${PLACE[k]}: ${da} + ${db}${carry?' + 1 que me llevaba':''} = ${s}. Escribo el ${s%10}${s>=10?' y me llevo 1':''}.`;}
    if(k===0) return da<db?`En las unidades: ${da} es menor que ${db}, así que hacemos ${da+10} − ${db} = ${da+10-db} y hay llevada.`:`En las unidades: ${da} − ${db} = ${da-db}.`;
    return `Revisa las ${PLACE[k]}. ¿Te has acordado de la llevada?`;
  }
  const kp=keypad(key=>{
    if(done) return;
    if(key==='ok'){
      if(resCells.every(c=>!c.textContent)) return;
      const bad=[];resCells.forEach((c,j)=>{const exp=R[j].trim(),got=c.textContent;const ok=exp===''?(got===''||got==='0'):got===exp;c.classList.toggle('bad',!ok);if(!ok)bad.push(j);});
      if(!bad.length){done=true;resCells.forEach(c=>{c.classList.remove('sel');c.classList.add('good');});carryCells.forEach(c=>c.classList.remove('sel'));ctx.right(`${a} ${op==='+'?'+':'−'} ${b} = ${res}`);}
      else ctx.wrong(hintFor(bad[bad.length-1]));
      return;
    }
    if(!sel) return;
    if(key==='del'){
      if(!sel.textContent&&resCells.includes(sel)){const j=resCells.indexOf(sel);if(j<W-1)select(resCells[j+1]);}
      sel.textContent='';sel.classList.remove('bad');return;
    }
    sel.textContent=key;sel.classList.remove('bad');
    if(carryCells.includes(sel)) select(resCells[+sel.dataset.col]);
    else{const j=resCells.indexOf(sel);if(j>0)select(resCells[j-1]);}
  });
  return {grid,kp};
}
function genOp(op,lvl){
  for(;;){
    if(op==='+'){
      if(lvl==='2'){const a=rnd(15,89),b=rnd(12,89);if(a%10+b%10>=10)return [a,b];}
      else{const a=rnd(105,780),b=rnd(105,Math.min(880,999-a));if(b<100)continue;if(a%10+b%10>=10||Math.floor(a/10)%10+Math.floor(b/10)%10+((a%10+b%10)>=10?1:0)>=10)return [a,b];}
    }else{
      if(lvl==='2'){const a=rnd(30,98),b=rnd(11,a-5);if(a%10<b%10)return [a,b];}
      else{const a=rnd(210,999),b=rnd(105,a-20);if(a%10<b%10||Math.floor(a/10)%10<Math.floor(b/10)%10)return [a,b];}
    }
  }
}

['+','-'].forEach(op=>defGame({id:op==='+'?'sumas':'restas',subject:'mates',icon:op==='+'?'➕':'➖',title:op==='+'?'Sumas con llevadas':'Restas con llevadas',

function numLine(n,low,step){
  const X=v=>40+(v-low)/step*560, NS='http://www.w3.org/2000/svg';
  const s=document.createElementNS(NS,'svg');s.setAttribute('viewBox','0 0 640 140');s.setAttribute('class','numline');s.setAttribute('role','img');s.setAttribute('aria-label',`Recta del ${low} al ${low+step}`);
  const add=(tag,at,txt)=>{const e=document.createElementNS(NS,tag);for(const k in at)e.setAttribute(k,at[k]);if(txt!=null)e.textContent=txt;s.append(e);return e;};
  add('line',{x1:40,y1:90,x2:600,y2:90,class:'axis'});
  for(let k=0;k<=10;k++){const v=low+k*step/10,x=X(v);add('line',{x1:x,y1:k===5?72:78,x2:x,y2:k===5?108:102,class:'tick'+(k===5?' mid':'')});}
  [low,low+step].forEach(v=>add('text',{x:X(v),y:134,'text-anchor':'middle'},v));
  add('text',{x:X(low+step/2),y:134,'text-anchor':'middle',style:'font-size:17px;fill:var(--ink-soft)'},low+step/2);
  const x=X(n);add('path',{d:`M${x-13} 44 L${x+13} 44 L${x} 66 Z`,class:'mark'});add('text',{x,y:34,'text-anchor':'middle',class:'mark-t'},n);
  return s;
}
defGame({id:'redondear',subject:'mates',icon:'🎯',title:'Redondear',desc:'Aproxima a la decena o a la centena más cercana',

function aniIcon(a,cls=''){return a.e.startsWith('img/')?h('img',{class:'q-emoji ani-img '+cls,src:a.e,alt:a.n}):h('div',{class:'q-emoji '+cls,'aria-hidden':'true'},a.e);}
const aniHead=a=>[aniIcon(a),h('div',{class:'with-say'},h('div',{class:'q-prompt'},cap(a.n)),sayBtn(a.n))];
function albumOf(p=me()){return (p&&p.album)||[];}
function unlockAnimal(n){const p=me(); if(!p||!ZN[n]) return false; p.album=p.album||[]; if(p.album.includes(n)) return false; p.album.push(n); save(); return true;}
const optsFrom=(all,right,n)=>shuffle([right,...pickN(all.filter(k=>k!==right),n-1)]);

defGame({id:'mapa',subject:'cono',icon:'🗺️',title:'¿Dónde vive?',desc:'Busca en el mapa del mundo el continente de cada animal',rounds:8,
  prepare(run){run.data.next=deck(ZOO.filter(a=>a.cont));},
  make(run){return run.data.next();},
  render(q,stage,ctx){
    let done=false;
    const map=h('div',{class:'map'},h('img',{src:'img/mapa.jpg',alt:'Mapa del mundo'}),
      Object.entries(CONT).map(([k,c])=>{const b=h('button',{class:'cont',style:`left:${c.x}%;top:${c.y}%`,onclick:()=>{
        if(done||b.classList.contains('ko')) return;
        if(k===q.cont){done=true;b.classList.add('ok');burst(b);ctx.right(q.where,{post:q.where});}
        else{b.classList.add('ko');ctx.wrong(`No vive en ${c.l}.`+(q.hab?` Pista: vive en ${HAB[q.hab].l.toLowerCase()}.`:''));}
      }},c.l);return b;}));
    stage.append(h('div',{class:'ani-row'},aniIcon(q,'small'),h('div',{class:'with-say'},h('div',{class:'q-prompt'},`${cap(q.n)}: ¿en qué continente vive?`),sayBtn(q.n))),map);
    instr(q.n,SAYC.mapa);
  }});
defGame({id:'casa',subject:'cono',icon:'🏡',title:'¿Cuál es su casa?',desc:'Selva, sabana, desierto, polo, océano, montaña, granja…',rounds:8,
  prepare(run){run.data.next=deck(ZOO.filter(a=>a.hab));},

    stage.append(pane2(aniHead(q),[h('p',{class:'q-note',style:'margin:0'},'¿Dónde vive este animal?'),
      choices(opts.map(k=>({value:k,label:`${HAB[k].e} ${HAB[k].l}`})),q.hab,ctx,{cls:'words',explain:`${q.where} ${HAB[q.hab].f}`,voice:{post:q.where},
        hint:k=>`No vive en ${HAB[k].l.toLowerCase()}. Piensa cómo es el sitio donde vive.`})]));
    instr(q.n,SAYC.casa);
  }});

defGame({id:'memory',subject:'ingles',icon:'🃏',title:'Memory',desc:'Encuentra las parejas de dibujo y palabra',options:EN_OPTS,
  custom(stage,run,ctx){
    const pairs=pickN(EN[run.opt],6);
    const cards=shuffle(pairs.flatMap(([e,w],i)=>[{i,kind:'e',txt:e,w},{i,kind:'w',txt:w,w}]));
    let open=[],lock=false,moves=0,found=0;
    const info=h('span',{class:'tag'},'Intentos: 0');
    const grid=h('div',{class:'memory'},cards.map(c=>{
      const b=h('button',{class:'card','aria-label':'Carta tapada',onclick:()=>{
        if(lock||b.classList.contains('up')||b.classList.contains('done')) return;
        sfx.pop();b.classList.add('up');b.setAttribute('aria-label',c.txt);sayEn(c.w);open.push([b,c]);
        if(open.length<2) return;
        moves++;info.textContent='Intentos: '+moves;const [[b1,c1],[b2,c2]]=open;open=[];
        if(c1.i===c2.i){setTimeout(()=>{b1.classList.add('done');b2.classList.add('done');sfx.ok();found++;
          if(found===pairs.length){const st=moves<=9?3:moves<=13?2:1;setTimeout(()=>ctx.finish(st,`Has encontrado las ${pairs.length} parejas en ${moves} intentos.`),900);}},350);}
        else{lock=true;setTimeout(()=>{[b1,b2].forEach(x=>{x.classList.remove('up');x.setAttribute('aria-label','Carta tapada');});lock=false;},1150);}
      }},h('span',{class:'card-in'},h('span',{class:'backf','aria-hidden':'true'},h('img',{src:IMG.wave,alt:''})),h('span',{class:'face'+(c.kind==='e'?' emo':'')},c.txt)));

defGame({id:'spell',subject:'ingles',icon:'🔤',title:'Spell it!',desc:'Escucha y escribe la palabra en inglés',options:{label:EN_OPTS.label,choices:[{id:'all',label:'All'},...EN_OPTS.choices]},
  prepare(run){const src=run.opt==='all'?Object.values(EN).flat():EN[run.opt];run.data.next=deck(src.filter(([,w])=>w.length<=6));},
  make(run){const [e,w]=run.data.next();return {e,w};},
  render(q,stage,ctx,run){
    const L=q.w.split(''),ABC='abcdefghiklmnoprstuwy'.split('').filter(c=>!L.includes(c));
    const slots=h('div',{class:'slots',style:'position:relative'},L.map(()=>h('span',{class:'slot'})));
    let filled=[],tries=0,busy=false;
    const tiles=h('div',{class:'tiles'},shuffle([...L,...pickN(ABC,2)]).map(ch=>{const b=h('button',{class:'tile',onclick:()=>{
      if(busy||b.classList.contains('used')||filled.length>=L.length) return;
      sfx.pop();b.classList.add('used');const s=slots.children[filled.length];s.textContent=ch;s.classList.add('on');filled.push(b);
      if(filled.length===L.length) check();}},ch);b.dataset.ch=ch;return b;}));
    function check(){
      const got=filled.map(b=>b.dataset.ch).join('');
      if(got===q.w){slots.classList.add('good');burst(slots);busy=true;ctx.right(`${q.e}  ${q.w}`);if(DB.sound)setTimeout(()=>sayEn(q.w),1200);}
      else{tries++;busy=true;ctx.wrong(tries>=2?`Se escribe así: ${q.w.split('').join(' - ')}`:'Escucha otra vez y piensa en cada sonido.');
        setTimeout(()=>{filled.forEach(b=>b.classList.remove('used'));filled=[];[...slots.children].forEach(s=>{s.textContent='';s.classList.remove('on');});busy=false;},700);}
    }
    const del=h('button',{class:'btn ghost',onclick:()=>{if(busy||!filled.length)return;const b=filled.pop();b.classList.remove('used');const s=slots.children[filled.length];s.textContent='';s.classList.remove('on');}},'⌫ Borrar');
    stage.append(pane2([h('div',{class:'q-emoji','aria-hidden':'true'},q.e),h('div',{class:'with-say'},h('div',{class:'q-prompt'},'Listen and spell'),sayBtn(q.w,'en-GB'))],[slots,tiles,del]));
    clearTimeout(instrTimer);
    instrTimer=setTimeout(()=>{if(run.i===0&&DB.sound) speak(SAYI.spell,'es-ES',.9,()=>sayEn(q.w)); else sayEn(q.w);},350);
  }});

const SAYR={start:'Lee en voz alta, despacito, respetando los puntos y las comas.',done:'¡Lectura terminada! Ahora cuéntale a alguien lo que has leído.'};
const dayKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
function weekStrip(){
  const p=me(),read=new Set((p&&p.read)||[]),now=new Date(),mon=new Date(now);mon.setDate(now.getDate()-((now.getDay()+6)%7));
  return h('div',{class:'week','aria-label':'Días que has leído esta semana'},['L','M','X','J','V','S','D'].map((l,k)=>{const d=new Date(mon);d.setDate(mon.getDate()+k);const key=dayKey(d);
    return h('div',{class:'day'+(read.has(key)?' done':'')+(key===dayKey(now)?' today':'')},h('div',null,read.has(key)?'✓':d.getDate(),h('br'),h('small',null,l)));}));
}
const ASK=['¿De qué trataba lo que has leído?','¿Quién salía? ¿Dónde pasaba?','¿Qué pasó al principio, en medio y al final?','¿Cómo crees que se sentía el personaje?','¿Qué es lo que más te ha gustado?','¿Qué crees que pasará después?'];
defGame({id:'leer',subject:'lectura',icon:'⏱️',title:'Lectura en voz alta',desc:'Temporizador de 10 o 15 minutos y preguntas para después',
  custom(stage,run){
    let mins=(DB.opt&&DB.opt.leerMin)||10,total=mins*60000,left=total,endAt=0,timer=null,wake=null,running=false;
    const NS='http://www.w3.org/2000/svg',R=120,CIRC=2*Math.PI*R;
    const svg=document.createElementNS(NS,'svg');svg.setAttribute('viewBox','0 0 280 280');
    const mk=cls=>{const c=document.createElementNS(NS,'circle');c.setAttribute('cx',140);c.setAttribute('cy',140);c.setAttribute('r',R);c.setAttribute('class',cls);svg.append(c);return c;};
    mk('trk');const val=mk('val');val.setAttribute('stroke-dasharray',CIRC);
    const fmt=ms=>{const s=Math.ceil(ms/1000);return `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`;};
    const time=h('div',{class:'time',role:'timer'},fmt(left));
    const draw=()=>{time.textContent=fmt(left);val.setAttribute('stroke-dashoffset',CIRC*(1-left/total));};
    const reqWake=async()=>{try{wake=await navigator.wakeLock.request('screen');}catch(e){wake=null;}};
    const relWake=()=>{try{wake&&wake.release();}catch(e){}wake=null;};
    const chips=h('div',{class:'chips'},[10,15].map(m=>h('button',{class:'chip'+(m===mins?' on':''),'data-m':m,onclick:()=>{if(running)return;mins=m;DB.opt=DB.opt||{};DB.opt.leerMin=m;save();total=left=m*60000;draw();sfx.pop();chips.querySelectorAll('.chip').forEach(x=>x.classList.toggle('on',+x.dataset.m===m));}},`${m} minutos`)));
    const startB=h('button',{class:'btn big',onclick:()=>{sfx.pop();running?pause():start();}},'▶ Empezar');
    const resetB=h('button',{class:'btn ghost',onclick:()=>{pause();left=total;draw();startB.textContent='▶ Empezar';}},'↺ Reiniciar');
    const doneBox=h('div',{class:'end',hidden:true});
    function tick(){left=Math.max(0,endAt-Date.now());draw();if(left<=0)finishRead();}
    function start(){if(left<=0)left=total;endAt=Date.now()+left;clearInterval(timer);timer=setInterval(tick,250);running=true;startB.textContent='⏸ Pausa';reqWake();}
    function pause(){if(!running)return;clearInterval(timer);timer=null;left=Math.max(0,endAt-Date.now());running=false;startB.textContent='▶ Seguir';relWake();draw();}
    function finishRead(){clearInterval(timer);timer=null;running=false;relWake();startB.textContent='▶ Otra vez';
      const p=me();if(p){p.read=[...new Set([...(p.read||[]),dayKey(new Date())])].slice(-90);save();}
      setStars('leer',3);const coin=$('#coin');if(coin)coin.textContent=totalStars();
      sfx.win();confetti();doneBox.hidden=false;doneBox.replaceChildren(h('div',{class:'end-stars'},[1,2,3].map(()=>h('span',{class:'on'},'★'))),mochi('happy'),h('h2',null,'¡Lectura terminada!'),h('p',null,'Ahora toca hablar de lo que has leído.'));
      week.replaceWith(week=weekStrip()); if(DB.sound) speak(SAYR.done);}
    cleanup=()=>{clearInterval(timer);relWake();};
    let week=weekStrip();
    stage.append(h('div',{class:'q-prompt'},'Lee en voz alta, despacito y respetando los puntos y las comas'),
      h('div',{class:'read-layout'},
        h('div',{class:'read-side'},chips,h('div',{class:'read-wrap'},mochi('read'),h('div',{class:'timer'},svg,time)),h('div',{class:'row center'},startB,resetB)),
        h('div',{class:'read-side'},doneBox,h('div',{class:'askcard'},h('h3',null,'Después de leer, pide a alguien de casa que te pregunte:'),h('ul',null,ASK.map(a=>h('li',null,a)))),
          h('strong',null,'Mi semana de lectura'),week)));
    draw(); instr(SAYR.start);
  }});

function nbEl(kind){
  const cells=[];const at=(el,c,r,span=1,rspan=1)=>{el.style.gridColumn=`${c} / span ${span}`;el.style.gridRow=`${r} / span ${rspan}`;cells.push(el);};
  let N;
  if(kind.startsWith('lengua')){N=18;
    for(let k=1;k<=2;k++) at(h('span',{class:'sq gapsq'},h('span',null,k)),k,1);
    at(h('span',{class:'sq dotsq'}),3,1);
    at(h('span',{class:'sq txt'},'Hoy es lunes y hace sol.'),4,1,15);
    at(h('span',{class:'sq'}),1,2);
  }else{N=24;const g1=kind==='mates1',g2=kind==='mates2';
    for(let k=1;k<=5;k++) at(h('span',{class:'sq'+(g1?' gapsq':'')},g1?h('span',null,k):null),k,2);
    at(h('span',{class:'sq cuenta'},h('span',null,'25'),h('span',null,'+13'),h('b',null,'38')),6,1,3,3);
    for(let k=1;k<=10;k++) at(h('span',{class:'sq'+(g2?' gapsq':'')},g2?h('span',null,k):null),8+k,2);
    at(h('span',{class:'sq cuenta'},h('span',null,'47'),h('span',null,'−21'),h('b',null,'26')),19,1,3,3);
    at(h('span',{class:'sq'}),24,3);
  }
  const nb=h('div',{class:'nb',style:`grid-template-columns:repeat(${N},32px);grid-template-rows:repeat(${kind.startsWith('lengua')?2:3},32px)`},cells);
  return h('div',{class:'nb-wrap',hidden:true},nb);
}
